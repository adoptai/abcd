<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adopt.ai - Microphone Permission</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #fafafa; color: #1a1a1a;
    }
    .container {
      text-align: center; max-width: 400px; padding: 40px;
      background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      padding: 12px 32px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      background: #2563eb; color: #fff; transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 13px; }
    .status.success { color: #22c55e; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Microphone Access</h1>
    <p>Adopt.ai needs microphone permission to enable voice recording in the side panel. Click the button below and allow microphone access when prompted.</p>
    <button class="btn" id="allowBtn">Allow Microphone</button>
    <div id="status" class="status"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
