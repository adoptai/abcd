<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fff;
      padding: 32px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .toolbar {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 0; margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .toolbar button {
      padding: 6px 14px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .toolbar button:hover { background: #f3f4f6; }
    .toolbar button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .toolbar button.primary:hover { background: #1d4ed8; }
    .toolbar .title { flex: 1; font-size: 18px; font-weight: 600; }
    .loading { text-align: center; padding: 64px; color: #9ca3af; }
    .error { text-align: center; padding: 64px; color: #ef4444; }

    /* Markdown content styles */
    .markdown-content h1 { font-size: 2em; font-weight: 700; margin: 0.8em 0 0.4em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    .markdown-content h2 { font-size: 1.5em; font-weight: 600; margin: 0.8em 0 0.4em; border-bottom: 1px solid #f3f4f6; padding-bottom: 0.2em; }
    .markdown-content h3 { font-size: 1.2em; font-weight: 600; margin: 0.8em 0 0.3em; }
    .markdown-content h4 { font-size: 1em; font-weight: 600; margin: 0.6em 0 0.2em; }
    .markdown-content p { margin: 0.5em 0; }
    .markdown-content ul, .markdown-content ol { margin: 0.5em 0; padding-left: 2em; }
    .markdown-content li { margin: 0.2em 0; }
    .markdown-content table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 14px; }
    .markdown-content th, .markdown-content td { padding: 8px 12px; border: 1px solid #e5e7eb; text-align: left; }
    .markdown-content th { background: #f9fafb; font-weight: 600; }
    .markdown-content code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: "SFMono-Regular", Consolas, monospace; }
    .markdown-content pre { background: #f3f4f6; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 0.8em 0; }
    .markdown-content pre code { background: none; padding: 0; }
    .markdown-content blockquote { border-left: 4px solid #e5e7eb; padding-left: 16px; color: #6b7280; margin: 0.8em 0; }
    .markdown-content a { color: #2563eb; text-decoration: none; }
    .markdown-content a:hover { text-decoration: underline; }
    .markdown-content hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.5em 0; }
    .markdown-content strong { font-weight: 600; }
    .markdown-content img { max-width: 100%; }

    /* Edit mode */
    .editor {
      width: 100%; min-height: 400px; padding: 16px; border: 1px solid #d1d5db;
      border-radius: 8px; font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 14px; line-height: 1.5; resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="toolbar" class="toolbar" style="display:none">
      <span id="doc-title" class="title"></span>
      <button id="btn-edit">Edit</button>
      <button id="btn-save" class="primary" style="display:none">Save</button>
      <button id="btn-cancel" style="display:none">Cancel</button>
    </div>
    <div id="loading" class="loading">Loading document...</div>
    <div id="error" class="error" style="display:none"></div>
    <div id="content" class="markdown-content" style="display:none"></div>
    <textarea id="editor" class="editor" style="display:none"></textarea>
  </div>

  <script src="viewer.js" type="module"></script>
</body>
</html>
