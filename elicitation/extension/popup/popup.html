<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafafa;
    }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 500px; height: 100vh; }
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb;
    }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
    .back-btn {
      background: none; border: none; cursor: pointer; font-size: 18px; padding: 0 4px; color: #374151;
    }

    .content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 16px; }

    /* Status bar */
    .status-bar {
      padding: 6px 16px; font-size: 11px; color: #6b7280;
      background: #f3f4f6; border-top: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #ef4444; flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; }

    /* Cards */
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
    }
    .card:hover { border-color: #2563eb; }
    .card h3 { font-size: 14px; font-weight: 500; }
    .card p { font-size: 12px; color: #6b7280; margin-top: 2px; }

    /* Buttons */
    .btn {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-danger { background: #fef2f2; color: #dc2626; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Forms */
    .input {
      width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13px; outline: none; font-family: inherit;
    }
    .input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #374151; }

    /* Chat */
    .messages-container { display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding: 8px 0; }
    .message {
      max-width: 80%; padding: 8px 12px; border-radius: 12px;
      margin-bottom: 6px; font-size: 13px; line-height: 1.4; word-wrap: break-word;
    }
    .message.human {
      background: #2563eb; color: #fff; align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.agent {
      background: #f3f4f6; color: #1a1a1a; align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message-meta { font-size: 10px; opacity: 0.7; margin-top: 2px; }

    /* Chat input */
    .chat-input-bar {
      display: flex; gap: 6px; padding: 12px 16px;
      background: #fff; border-top: 1px solid #e5e7eb; align-items: center;
    }
    .chat-input-bar .input { flex: 1; min-width: 0; }
    .chat-input-bar .btn { flex-shrink: 0; }
    .chat-input-bar .icon-btn { flex-shrink: 0; }

    /* Recording controls */
    .recording-controls {
      display: flex; gap: 6px; align-items: center; padding: 8px 0;
    }
    .rec-status { font-size: 12px; font-weight: 500; }
    .rec-status.recording { color: #dc2626; }
    .rec-status.paused { color: #f59e0b; }
    .rec-status.idle { color: #6b7280; }
    .rec-status.stopped { color: #6b7280; }

    /* Icon buttons */
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: #f3f4f6; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .icon-btn:hover { background: #e5e7eb; }
    .icon-btn.listening { background: #fecaca; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid #e5e7eb; background: #fff; }
    .tab {
      flex: 1; padding: 8px; text-align: center; font-size: 12px; font-weight: 500;
      border: none; background: none; cursor: pointer; color: #6b7280;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }

    /* Plumbing Test View */
    .test-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 8px;
    }
    .test-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .test-card p { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .test-result {
      font-size: 12px; padding: 6px 8px; border-radius: 4px; margin-top: 6px;
      font-family: monospace; white-space: pre-wrap; word-break: break-all;
    }
    .test-result.pass { background: #dcfce7; color: #166534; }
    .test-result.fail { background: #fef2f2; color: #991b1b; }
    .test-result.info { background: #eff6ff; color: #1e40af; }
    .test-result.running { background: #fef9c3; color: #854d0e; }
    .test-thumbnail { max-width: 100%; max-height: 120px; border-radius: 4px; margin-top: 6px; }

    /* Utility */
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-sm { gap: 6px; }
    .mt-sm { margin-top: 8px; }
    .text-muted { color: #6b7280; font-size: 12px; }
    .empty-state { text-align: center; padding: 32px 16px; color: #9ca3af; }
    .interim-text {
      color: #374151; font-style: italic; font-size: 13px; padding: 6px 12px;
      background: #fefce8; border-left: 3px solid #facc15; margin: 0 16px 4px;
      border-radius: 0 6px 6px 0;
    }

    /* Voice mode toggle */
    .voice-controls { display: flex; align-items: center; gap: 4px; }
    .voice-mode-toggle {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
      border: 1px solid; cursor: pointer; text-transform: uppercase;
      line-height: 1.3; white-space: nowrap;
    }
    .voice-mode-toggle.narrate { background: #fff7ed; color: #ea580c; border-color: #fdba74; }
    .voice-mode-toggle.chat { background: #eff6ff; color: #2563eb; border-color: #93c5fd; }
    .icon-btn.narrate-active { background: #fed7aa; }
    .icon-btn.chat-active { background: #bfdbfe; }

    /* Capture session controls */
    .capture-controls {
      display: flex; gap: 6px; align-items: center; padding: 8px 0; flex-wrap: wrap;
    }
    .capture-status {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    }
    .capture-status.capturing { background: #fef2f2; color: #dc2626; animation: pulse 1.5s infinite; }
    .capture-status.paused { background: #fef9c3; color: #854d0e; }
    .capture-status.stopped { background: #f3f4f6; color: #6b7280; }
    .capture-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #374151; }
    .capture-toggle input { margin: 0; }
    .narration-indicator {
      font-size: 10px; font-weight: 600; color: #dc2626;
      animation: pulse 1.5s infinite;
    }
    .narration-interim {
      font-size: 12px; font-style: italic; color: #ea580c;
      padding: 4px 0; border-top: 1px dashed #fdba74;
      margin-top: 4px;
    }

    /* Screenshot controls */
    .screenshot-controls { display: flex; gap: 2px; }
    .section-title { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }

    /* Toast notifications */
    .toast-container {
      position: fixed; bottom: 12px; right: 12px; left: 12px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      padding: 10px 16px; border-radius: 8px; color: white; font-size: 13px;
      cursor: pointer; pointer-events: auto;
      animation: toastSlideIn 0.2s ease-out;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .toast.success { background: #22c55e; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #3b82f6; }
    @keyframes toastSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Capture grid */
    .capture-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px;
    }
    .capture-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      overflow: hidden; cursor: pointer; transition: border-color 0.15s;
    }
    .capture-card:hover { border-color: #2563eb; }
    .capture-card img { width: 100%; height: 80px; object-fit: cover; }
    .capture-card .capture-meta { padding: 4px 6px; font-size: 10px; color: #6b7280; }

    /* Timeline */
    .timeline { list-style: none; padding: 0; margin: 0; }
    .timeline-item {
      display: flex; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid #f3f4f6; font-size: 13px;
    }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .timeline-icon.message { background: #eff6ff; }
    .timeline-icon.screenshot { background: #fef3c7; }
    .timeline-icon.click { background: #fce7f3; }
    .timeline-icon.input { background: #fef3c7; }
    .timeline-icon.change { background: #e0e7ff; }
    .timeline-icon.submit { background: #d1fae5; }
    .timeline-icon.voice { background: #ecfdf5; }
    .timeline-icon.recording { background: #fef2f2; }
    .timeline-icon.narration { background: #fff7ed; }
    .timeline-icon.url_change { background: #f0fdf4; }
    .timeline-icon.capture { background: #faf5ff; }
    .timeline-icon.network { background: #dbeafe; }
    .timeline-body { flex: 1; min-width: 0; }
    .timeline-summary { color: #1a1a1a; line-height: 1.4; word-break: break-word; }
    .timeline-summary.narration-full { white-space: pre-wrap; }
    .timeline-time { font-size: 10px; color: #9ca3af; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
    .timeline-copy-btn {
      background: none; border: none; cursor: pointer; font-size: 11px;
      padding: 0 2px; opacity: 0.4; transition: opacity 0.15s;
    }
    .timeline-copy-btn:hover { opacity: 1; }
    .timeline-item:hover .timeline-copy-btn { opacity: 0.7; }

    /* Markdown content */
    .markdown-content h1 { font-size: 1.4em; font-weight: 700; margin: 0.6em 0 0.3em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
    .markdown-content h2 { font-size: 1.2em; font-weight: 600; margin: 0.6em 0 0.3em; }
    .markdown-content h3 { font-size: 1.05em; font-weight: 600; margin: 0.5em 0 0.2em; }
    .markdown-content p { margin: 0.4em 0; font-size: 13px; line-height: 1.5; }
    .markdown-content ul, .markdown-content ol { margin: 0.4em 0; padding-left: 1.5em; font-size: 13px; }
    .markdown-content li { margin: 0.15em 0; }
    .markdown-content table { width: 100%; border-collapse: collapse; margin: 0.5em 0; font-size: 12px; }
    .markdown-content th, .markdown-content td { padding: 4px 8px; border: 1px solid #e5e7eb; text-align: left; }
    .markdown-content th { background: #f9fafb; font-weight: 600; }
    .markdown-content code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 0.9em; font-family: monospace; }
    .markdown-content pre { background: #f3f4f6; padding: 8px; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; font-size: 12px; }
    .markdown-content pre code { background: none; padding: 0; }
    .markdown-content blockquote { border-left: 3px solid #e5e7eb; padding-left: 10px; color: #6b7280; margin: 0.5em 0; }
    .markdown-content a { color: #2563eb; text-decoration: none; }
    .markdown-content a:hover { text-decoration: underline; }
    .markdown-content hr { border: none; border-top: 1px solid #e5e7eb; margin: 1em 0; }
    .markdown-content strong { font-weight: 600; }

    /* Card action buttons */
    .card-actions { opacity: 0; transition: opacity 0.15s; }
    .card:hover .card-actions { opacity: 1; }
    .btn-danger-confirm { background: #dc2626; color: #fff; }
    .btn-danger-confirm:hover { background: #b91c1c; }

    /* Chat session bar */
    .chat-session-bar { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
    .chat-session-select { flex: 1; font-size: 12px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .chat-session-rename-input { flex: 1; font-size: 12px; padding: 3px 6px; border: 1px solid #6366f1; border-radius: 4px; background: #fff; min-width: 0; outline: none; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 8px; }
    .lightbox-close {
      position: absolute; top: 12px; right: 12px; color: #fff; background: rgba(0,0,0,0.5);
      border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .lightbox-close:hover { background: rgba(0,0,0,0.8); }
    .lightbox-actions {
      position: absolute; bottom: 16px; display: flex; gap: 8px;
    }

    /* Questions */
    .question-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .question-answer {
      margin-top: 6px; padding: 6px 8px; background: #f0fdf4;
      border-radius: 4px; font-size: 12px; color: #166534;
    }
    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
    }
    .status-open { background: #fef3c7; color: #92400e; }
    .status-answered { background: #dbeafe; color: #1e40af; }
    .status-resolved { background: #d1fae5; color: #065f46; }
    .filter-pills { display: flex; gap: 4px; }
    .pill {
      padding: 3px 10px; border-radius: 12px; border: 1px solid #d1d5db;
      background: #fff; font-size: 11px; cursor: pointer;
    }
    .pill.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Capture Sessions List */
    .session-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .session-status {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    }

    /* Text size options */
    body.text-normal { font-size: 14px; }
    body.text-larger { font-size: 16px; }
    body.text-largest { font-size: 18px; }

    body.text-larger .header h1 { font-size: 17px; }
    body.text-larger .message { font-size: 15px; }
    body.text-larger .tab { font-size: 13px; }
    body.text-larger .btn { font-size: 14px; }
    body.text-larger .card h3 { font-size: 15px; }
    body.text-larger .card p { font-size: 13px; }
    body.text-larger .input { font-size: 14px; }
    body.text-larger .status-bar { font-size: 12px; }
    body.text-larger .timeline-item { font-size: 14px; }
    body.text-larger .markdown-content p { font-size: 15px; }

    body.text-largest .header h1 { font-size: 19px; }
    body.text-largest .message { font-size: 16px; }
    body.text-largest .tab { font-size: 14px; }
    body.text-largest .btn { font-size: 15px; }
    body.text-largest .card h3 { font-size: 16px; }
    body.text-largest .card p { font-size: 14px; }
    body.text-largest .input { font-size: 15px; }
    body.text-largest .status-bar { font-size: 13px; }
    body.text-largest .timeline-item { font-size: 15px; }
    body.text-largest .markdown-content p { font-size: 16px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
