<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adopt Builder: how agents are built, tested and released</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
/* Ledger Ink tokens, inlined from adoptwebui docs/design-language/tokens.css */
:root {
  --frame: #ebeae5; --paper: #f8f8f6; --canvas: #efeee9; --sunken: #f2f2ef; --surface: #ffffff; --raised: #ffffff; --hover: #f0f0ec;
  --line: #e4e3df; --line-strong: #d3d2cd;
  --text: #1a1c1f; --muted: #63666b; --faint: #8a8d92;
  --ink: #15171a; --ink-hover: #2c2f34; --on-ink: #ffffff; --sel-bg: var(--ink); --sel-fg: var(--on-ink); --sel-line: var(--ink);
  --accent: #1f4e8c; --accent-hover: #183f72; --accent-soft: rgba(31, 78, 140, .08); --accent-line: rgba(31, 78, 140, .30); --accent-2: #a9bedb;
  --term-bg: #0f172a; --term-line: #1e293b; --term-rule: rgba(148, 163, 184, .12);
  --term-text: #e2e8f0; --term-muted: #94a3b8; --term-out: #cbd5e1;
  --term-err: #fca5a5; --term-err-bg: rgba(239, 68, 68, .12); --term-link: #93c5fd;
  --ok: #2f6b45; --ok-bg: #e7f0e9; --rv: #8a5a12; --rv-bg: #f6eedf; --ex: #a3291f; --ex-bg: #f8e6e3; --dr: #5f6368; --dr-bg: #eeeeeb;
  --skel: #efeee9;
  --shadow-card: 0 1px 2px rgba(20, 22, 26, .04);
  --shadow-pop: 0 10px 30px rgba(20, 22, 26, .12), 0 2px 6px rgba(20, 22, 26, .06);
  --scrim: rgba(17, 18, 20, .30);
  --bubble: #1f2226; --on-bubble: #ffffff; --logo-tile: #ffffff;
  --sheet: #ffffff; --sheet-ink: #1d1d1f; --sheet-mute: #5c5f64; --sheet-rule: #d9d9d6; --sheet-fill: #f2f2ef; --sheet-hl: #fbe7b5; --sheet-ev: #cfe0f7; --pv-canvas: #e6e6e3;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-pill: 4px; --r-btn: 6px; --r-card: 10px; --r-modal: 12px;
  --t-fast: .12s; --t-base: .2s;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --frame: #0b0c0e; --paper: #111214; --canvas: #16171b; --sunken: #15161a; --surface: #191b1e; --raised: #1f2125; --hover: #202226;
  --line: #2a2c31; --line-strong: #3a3d43;
  --text: #e8e9eb; --muted: #9a9ea5; --faint: #7b7f86;
  --ink: #34373e; --ink-hover: #3d4048; --on-ink: #f2f3f5; --sel-bg: #30333a; --sel-fg: #eceef0; --sel-line: #4a4e56;
  --accent: #86abdf; --accent-hover: #a3c0e8; --accent-soft: rgba(134, 171, 223, .14); --accent-line: rgba(134, 171, 223, .38); --accent-2: #3f5878;
  --ok: #7fc296; --ok-bg: rgba(127, 194, 150, .14); --rv: #dcae5e; --rv-bg: rgba(220, 174, 94, .15); --ex: #ec8a7e; --ex-bg: rgba(236, 138, 126, .15); --dr: #a7aab0; --dr-bg: rgba(167, 170, 176, .12);
  --skel: #222428; --shadow-card: none; --shadow-pop: 0 14px 36px rgba(0, 0, 0, .55), 0 0 0 1px #2e3136; --scrim: rgba(0, 0, 0, .55);
  --bubble: #2b2e34; --on-bubble: #eceef0; --logo-tile: var(--raised); --pv-canvas: #0d0e10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--frame); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 4px; }

.shell { display: flex; height: 100vh; }
.side { width: 256px; flex: none; display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 14px; cursor: pointer; }
.brand-tile { width: 30px; height: 30px; border-radius: 8px; background: var(--logo-tile); display: grid; place-items: center; box-shadow: var(--shadow-card); }
.brand-name { font-weight: 600; font-size: 14px; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav-group { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; padding: 14px 10px 4px; }
.nav-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: var(--text); font: inherit; font-size: 13.5px; padding: 6px 10px; border-radius: var(--r-btn); cursor: pointer; transition: background var(--t-fast); }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-card); }
.side-foot { margin-top: auto; padding: 12px 10px 4px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.side-foot .who { font-size: 12.5px; color: var(--muted); }
.icon-btn { width: 32px; height: 32px; border: none; background: none; color: var(--text); border-radius: var(--r-btn); cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: var(--hover); }

.panel { flex: 1; margin: 10px 10px 10px 0; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); overflow-y: auto; }
.page { max-width: 1180px; padding: 36px 44px 80px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 10px; }
.lead { font-size: 15.5px; color: var(--text); max-width: 820px; margin: 0 0 22px; }
.sub { color: var(--muted); max-width: 820px; }
h2 { font-size: 17px; font-weight: 600; margin: 34px 0 10px; }
h3 { font-size: 14.5px; font-weight: 600; margin: 0 0 6px; }
p { margin: 0 0 10px; max-width: 860px; }
ul, ol { margin: 0 0 12px; padding-left: 20px; max-width: 860px; }
li { margin: 3px 0; }

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 16px 18px; }
.card .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.card p, .card li { color: var(--text); font-size: 13.5px; }
.card .meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.card.click { cursor: pointer; transition: border-color var(--t-fast); }
.card.click:hover { border-color: var(--line-strong); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; white-space: nowrap; vertical-align: middle; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { color: var(--ok); background: var(--ok-bg); }
.p-rv { color: var(--rv); background: var(--rv-bg); }
.p-ex { color: var(--ex); background: var(--ex-bg); }
.p-dr { color: var(--dr); background: var(--dr-bg); }
.tag { display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 6px; margin: 1px 2px 1px 0; }

table.t { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; font-size: 13px; margin: 6px 0 14px; }
table.t th { background: var(--sunken); color: var(--muted); font-weight: 500; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: none; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--hover); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-btn); overflow: hidden; background: var(--surface); margin: 0 6px 10px 0; flex-wrap: wrap; }
.seg button { border: none; background: none; font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer; color: var(--text); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--sel-bg); color: var(--sel-fg); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: var(--r-btn); cursor: pointer; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-hover); }
.btn:disabled { opacity: .45; cursor: default; }
.input { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: var(--r-btn); width: 260px; }

.term { background: var(--term-bg); border: 1px solid var(--term-line); color: var(--term-text); border-radius: var(--r-card); padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow-x: auto; white-space: pre; margin: 6px 0 14px; }
.term .c { color: var(--term-muted); }
.term .o { color: var(--term-out); }
.term .l { color: var(--term-link); }
.term .e { color: var(--term-err); }

.tree { font-family: var(--mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 6px; }
.tree .row { display: flex; gap: 12px; padding: 3px 8px; border-radius: var(--r-pill); cursor: default; }
.tree .row.dir { cursor: pointer; }
.tree .row:hover { background: var(--hover); }
.tree .name { white-space: nowrap; }
.tree .desc { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
.tree .kids { margin-left: 18px; border-left: 1px solid var(--line); }
.tree .kids.closed { display: none; }
.caret { display: inline-block; width: 12px; color: var(--faint); }

.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; align-items: start; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.list button { display: block; width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; }
.list button:last-child { border-bottom: none; }
.list button:hover { background: var(--hover); }
.list button.on { background: var(--accent-soft); }
.list button .small { display: block; font-size: 12px; color: var(--muted); }

.loop { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin: 8px 0 14px; }
.loop button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-btn); padding: 8px 6px; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; text-align: left; min-height: 64px; }
.loop button .n { display: block; font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.loop button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.loop button.plat { background: var(--sunken); }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); vertical-align: -2px; margin-right: 6px; }

.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.kv .k { color: var(--muted); }
.note { border-left: 3px solid var(--line-strong); padding: 6px 12px; color: var(--muted); font-size: 13px; margin: 8px 0 14px; max-width: 860px; background: var(--surface); border-radius: 0 var(--r-btn) var(--r-btn) 0; }
.note.rv { border-left-color: var(--rv); }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps li { counter-increment: s; position: relative; padding: 8px 12px 8px 40px; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface); margin: 6px 0; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 8px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps li.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.steps li.future { opacity: .55; }
.who-chip { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 6px; margin-left: 6px; }

.portal { border: 1px solid var(--line-strong); border-radius: var(--r-modal); overflow: hidden; background: var(--frame); }
.portal-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunken); font-size: 13px; }
.portal-body { padding: 18px; background: var(--paper); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .d { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--ink); }

.report { background: var(--sheet); color: var(--sheet-ink); border: 1px solid var(--sheet-rule); border-radius: var(--r-card); padding: 22px 26px; }
.report .rh { display: flex; justify-content: space-between; border-bottom: 1px solid var(--sheet-rule); padding-bottom: 10px; margin-bottom: 12px; }
.report .muted { color: var(--sheet-mute); font-size: 12.5px; }
.report table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0 14px; }
.report th { text-align: left; color: var(--sheet-mute); font-weight: 500; border-bottom: 1px solid var(--sheet-rule); padding: 5px 6px; }
.report td { border-bottom: 1px solid var(--sheet-rule); padding: 5px 6px; }
.report td.num, .report th.num { text-align: right; font-variant-numeric: tabular-nums; }
.report h4 { font-size: 13px; margin: 14px 0 4px; }

.matrix td.c { text-align: center; }
.yes { color: var(--ok); font-weight: 600; }
.part { color: var(--rv); font-weight: 600; }
.no { color: var(--faint); }
.hl td { background: var(--accent-soft); }

@media (max-width: 1000px) {
  .side { display: none; }
  .panel { margin: 0; border-radius: 0; }
  .page { padding: 24px 18px 60px; }
  .g3, .g5, .g2, .split { grid-template-columns: 1fr; }
  .loop { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="panel" id="panel"><div class="page" id="page"></div></main>
</div>

  { name: 'Knowledge graph', what: 'The client\'s systems, APIs and entities, and the skills and agents that already exist.', ex: 'The client\'s CRM, file shares, the email-sorting skill.', use: 'Context for drafting. Shows what a change affects before it ships.', where: 'Builder: context workstream (client org)' },

  { name: 'Process documentation', what: 'SOPs, playbooks, step lists and sign-off rules.', ex: 'The 7-step return prep and its sign-offs.', use: 'Drafts the agent: its steps, HITL gates, approvals and a skill per step.', where: 'context/process-docs/' },
];

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const st = s => s === 'exists' ? EX : s === 'branch' ? EXA : s === 'setup' ? SETUP : s === 'workaround' ? WORK : s === 'decide' ? DEC : ABCD;

function tree(nodes) {
  return nodes.map(n => {
    const kids = n.k ? `<div class="kids">${tree(n.k)}</div>` : '';
    return `<div><div class="row ${n.k ? 'dir' : ''}" ${n.k ? 'data-tree="1"' : ''}><span class="name"><span class="caret">${n.k ? '▾' : ''}</span>${esc(n.n)}</span><span class="desc">${esc(n.d)}</span></div>${kids}</div>`;
  }).join('');
}

function pOverview() {
  return `<h1>Adopt Builder</h1>
  <p class="lead">Every Adopt agent is built through one headless Builder: abcd, with NoUI and Tabby already merged in. FDEs drive it from their own coding agent, on their own subscription, or from a harness chat in the cloud, where abcd runs inside the sandbox. Every skill and agent change becomes a versioned, staged release that must pass its dataset gate, and each release carries its eval report.</p>
  <p class="sub"><b>The workspace is the unit of everything.</b> One client org is one workspace, <code>workspaces/&lt;env&gt;/</code>, and each workspace is its own private git repo. Switching clients is switching workspaces: <code>python cli/workspace.py env use &lt;client&gt;</code>, or <code>--env</code> on any command. The repo keeps a client's skills, agents, datasets and checks in sync across FDEs, machines and the cloud. See <a href="#workspaces" data-go="workspaces">Workspaces and cloud</a>.</p>
  <p class="sub"><b>Goal number one: no new platform features.</b> The Builder is abcd (this repo), one private git repo per client workspace, and a one-time setup of existing platform objects (workstreams, Doc Stores, tables, processes, cron pipelines, grants, vault secrets). Where the platform cannot do something, this page says so and shows the workaround. Nothing waits on a platform release.</p>
  <p class="sub"><b>Done means reproducible blind.</b> During the build phase the FDE and a customer-appointed SME keep adding missing context until a generic prompt, the knowledge graph's instructions and the skills reproduce the golden dataset on their own. Blind evals prove it, and gate every release.</p>
  <p class="sub"><b>WDL is legacy.</b> WDL actions, uber agents, pipelines and lambdas keep working as they do today. They live in the same workspace, so they get git history, but no staged shadows, datasets, gate or drift audit.</p>
  <p class="sub">The FDE defines five inputs and approves the plan. The Builder does the rest and asks only when the inputs do not settle something. This page is written by hand for review; once built, abcd regenerates a page like it for every agent on every release.</p>

  <h2>The five inputs an FDE defines</h2>

function pLoop() {
  const s = LOOP[state.step];
  return `<h1>The builder loop</h1>
  <p class="lead">Every agent goes through the same 10 steps. The Builder runs steps 1 to 7 itself until the gate metrics pass. Steps 8 to 10 move that exact version through staging to live. Every step runs in the active workspace (<code>--env</code> picks another), on your machine or in the cloud. In the cloud, steps 2 to 10 run; step 1's NoUI capture and replay stay local.</p>
  <div class="legend"><span><span class="sw" style="background:var(--surface)"></span>Runs on your subscription (platform tokens when run in the cloud)</span><span><span class="sw" style="background:var(--sunken)"></span>Runs on platform tokens</span></div>
  <div class="loop">${LOOP.map((x, i) => `<button class="${x.where === 'platform' ? 'plat' : ''} ${i === state.step ? 'on' : ''}" data-step="${i}"><span class="n">${x.n}</span>${x.name}</button>`).join('')}</div>
  <div class="card">
    <h3>Step ${s.n} · ${s.name} <span class="who-chip">${s.who}</span> <span class="who-chip">${s.where === 'local' ? 'Your subscription' : 'Platform tokens'}</span></h3>
    <p>${esc(s.what)}</p>
    <div class="kv" style="margin-top:10px">
      <div class="k">abcd</div><div><div class="term" style="margin:0">${esc(s.cmd)}</div></div>
      <div class="k">Platform routes</div><div><span class="tag">${esc(s.api)}</span></div>
      <div class="k">Writes</div><div>${esc(s.writes)}</div>
      <div class="k">Meta skills</div><div>${esc(s.skills)}</div>
      <div class="k">Reuses</div><div>${esc(s.reuse)}</div>
    </div>
    <div style="margin-top:12px; display:flex; gap:8px"><button class="btn" data-step="${Math.max(0, state.step - 1)}" ${state.step === 0 ? 'disabled' : ''}>Previous step</button><button class="btn" data-step="${Math.min(LOOP.length - 1, state.step + 1)}" ${state.step === LOOP.length - 1 ? 'disabled' : ''}>Next step</button></div>
  </div>
  <h2>The two gates</h2>
  <div class="grid g2">
    <div class="card"><h3>Step 7: do the evals pass?</h3><p>Every gate metric on the draft, on the linked dataset version, must meet its target. Until then the Builder keeps iterating.</p></div>
    <div class="card"><h3>Step 10: the release gate</h3><p>Deterministic code in abcd release, and it refuses on any error. It only accepts a staged run on the exact staged hashes, from a commit on the workspace's default branch. A lead can force a release with a recorded reason; forced releases stay flagged until a passing run catches up. The platform cannot refuse an edit made outside abcd, so abcd audit drift flags any live object that does not match its last release.</p></div>
  </div>
  <h2>How a step is run</h2>
  <p><code>abcd &lt;area&gt; &lt;command&gt;</code> is <code>python cli/abcd.py &lt;area&gt; &lt;command&gt;</code>. abcd's pyproject.toml has <code>package-mode = false</code>, so there is no console script; ADOPT.md suggests a shell alias. <code>cli/abcd.py</code> dispatches to the existing scripts and the new builder_* ones.</p>
  <h2>What the loop reuses from the combined branch</h2>
  <table class="t"><tr><th>abcd command</th><th>Reuses</th></tr>${LOOP_REUSE.map(r => `<tr><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
  <div class="note">Cron pipelines have no abcd client. They are created once from a browser session, because a pipeline created with a PAT records the token id as its owner.</div>`;
}

function pAbcd() {
  return `<h1>abcd and your coding agent</h1>
  <p class="lead">You download one file, tell your coding agent to follow it, and from then on you talk to your agent in plain words. abcd is what your agent calls underneath.</p>
  <h2>Getting started</h2>
  <ol class="steps">
    <li>Clone abcd (this repo). NoUI, Tabby and the abcd-builder plugin come with it. <code>abcd</code> below is <code>python cli/abcd.py</code>; ADOPT.md suggests an alias.</li>
    <li>Get the client's workspace. For an existing client: <code>abcd ws clone &lt;repo&gt; --env acme</code>. For a new one: <code>python cli/workspace.py env create acme</code>, then <code>abcd ws init --env acme --remote &lt;url&gt;</code>.</li>
    <li>In Adopt, mint a Personal Access Token in the client org (Settings, as today; writes need an Admin user). Put its client id and secret in <code>workspaces/acme/.env</code>, which is never committed.</li>
    <li>Tell Claude Code, Codex or Cursor: <i>follow workspaces/acme/ADOPT.md</i>. On first use it installs the abcd-builder plugin once for your machine from abcd's marketplace (<code>claude plugin marketplace add &lt;abcd checkout&gt;</code>, then <code>claude plugin install abcd-builder@abcd</code>, or <code>npx skills add &lt;abcd checkout&gt;</code> for other agents), checks the PAT and runs <code>abcd ws status</code>.</li>
    <li>To work on another client: <code>python cli/workspace.py env use acme</code>, or <code>--env acme</code> on a single command. Nothing about one client lives outside its workspace.</li>
    <li>From here you say things like "add a step that checks the trial balance", "run the evals", "why did pair 17 fail", "ship it". The meta skills turn each into the right abcd commands. With no machine to hand, the same commands run from a harness chat with abcd-runner, for steps 2 to 10 of the loop.</li>

  <h2>What a session looks like</h2>
  <div class="term"><span class="c"># you: the reconciliation step keeps asking for help on multi-entity clients. fix it.</span>

<span class="o">$ abcd review harness/skills/tb-reconcile</span>
  0 critical · 1 medium: batch the per-entity reads
<span class="o">$ git -C workspaces/acme commit -am "tb-reconcile: split entities" && git -C workspaces/acme push</span>
<span class="o">$ abcd push acme-1120pc-prep --staged</span>
  staged lock: you · tb-reconcile--staged uploaded · acme-1120pc-prep-staged patched · acme@4f1c2e9 · verified
<span class="o">$ abcd eval run acme-1120pc-prep --blind</span>
  48 pairs · blind repro 97.9% · accuracy 97.9% (target 95%) · first-pass yield 81% (target 75%) · no regressions
<span class="l">  report: builder-ops/evals/ev_7f2a/summary.json</span>
<span class="c"># you: ship it. A lead merges fde/multi-entity into the acme default branch.</span>
<span class="o">$ abcd stage acme-1120pc-prep && abcd test-staged acme-1120pc-prep</span>
<span class="o">$ abcd release acme-1120pc-prep</span>
  on default branch · no default-tier name collisions · gate: pass · tb-reconcile uploaded · live agent patched · verified
  v13 live · tag acme-1120pc-prep@v13 on the staged commit · report, explainer, training on release/acme-1120pc-prep@v13 (pull request opened)</div>
  <div class="note">Illustrative session. Names and numbers are examples.</div>
  <h2>Command reference</h2>
  <table class="t"><tr><th>Command</th><th>What it does</th><th>Reuses</th><th>Status</th></tr>
  ${ABCDCMDS.map(a => `<tr><td class="mono" style="white-space:nowrap">${esc(a.cmd)}</td><td>${esc(a.what)}</td><td class="mono">${esc(a.replaces)}</td><td>${st(a.status)}</td></tr>`).join('')}

function pWorkspaces() {
  return `<h1>Workspaces and cloud</h1>
  <p class="lead">One client org is one workspace, and each workspace is its own private git repo. The same abcd code, the same workspace repo and the same commands run on an FDE's machine and in the Agent Harness.</p>
  <h2>What exists today</h2>
  <ul><li><code>workspaces/&lt;env&gt;/</code> holds env.json (name, target, client, domain), .env (credentials), adopt_profile.json and the WDL folders agents/, actions/, pipelines/ and lambdas/.</li>
  <li><code>workspaces/&lt;env&gt;/harness/</code> holds skills/&lt;skill&gt;/ (what harness_skill.py push reads and NoUI compiles into), the NoUI workbench (bundles/, sessions/, mcp_servers/, login_recordings/) and runtime data (traces/, workstreams.json, .token_cache.json).</li>
  <li><code>workspaces/.active_env</code> is the active workspace. Every command takes --env and defaults to it.</li>
  <li>abcd's own .gitignore ignores <code>workspaces/*</code> except the tracked default/ example, and always ignores <code>workspaces/*/harness/</code>.</li></ul>
  <h2>What the Builder adds</h2>
  <p>A client workspace becomes its own private repo. It sits inside abcd's ignored workspaces/ folder, so abcd's git never sees it and it is never a submodule. The default workspace stays abcd's tracked example and is never made a repo.</p>
  <table class="t"><tr><th>Command</th><th>What it does</th><th>Status</th></tr>${WS_CMDS.map(c => `<tr><td class="mono" style="white-space:nowrap">${esc(c[0])}</td><td>${esc(c[1])}</td><td>${st(c[2])}</td></tr>`).join('')}</table>
  <h2>Layout</h2><p class="sub">Click a folder to fold it. "New" marks what the Builder adds; "Exists" is there today.</p>
  <div class="tree">${tree(WS_TREE)}</div>
  <h2>Committed and ignored</h2>
  <ul><li>The workspace .gitignore covers credentials (.env, .env.*, harness/.token_cache.json, *.pem, *.key), harness runtime (harness/traces/, harness/sessions/, harness/workstreams.json), NoUI captures (harness/bundles/, harness/skills/*/recording_bundle.json, *.har), WDL runtime (.cache/, agents/*/traces/, actions/*/traces/) and Builder local state (context/, .builder/).</li>
  <li>Everything else is source.</li>
  <li><b>Capture bundles never go in git.</b> Login recordings and non-browser workflow recordings keep the full HAR and the app's cookies, which no scan reliably strips. <code>abcd ws push-bundles</code> uploads them, and every recording_bundle.json, to a noui-bundles Doc Store linked only to builder-ops, and records their paths and SHA-256 in harness/bundles.lock.json. <code>abcd ws pull-bundles</code> restores them on another machine or in the cloud.</li>
  <li>A workspace pre-commit hook refuses a commit when abcd's content secret scan fails on any staged file, when NoUI's count_sensitive_unredacted fails on anything bundle-shaped, or when adopt_profile.json holds security_params values (WDL keeps cookies there; they belong in .env).</li>
  <li>Dataset input and expected files never go in the repo either. A cloud run clones it into a sandbox.</li></ul>
  <div class="note"><b>Why harness/agents/.</b> The WDL agents/ folder at the workspace root already means uber agents. Harness agents are processes, which is what the harness CLI calls them, so they go under harness/, next to the skills they use. ADOPT.md spells out the difference for the coding agent.</div>
  <h2>How the repo and the platform stay in sync</h2>
  <ul><li><b>The repo is the source of truth for definitions.</b> The platform only holds deployments: live objects, staged shadows, datasets and history. Nothing on the platform ever reads git.</li>
  <li><b>abcd ws pull</b> imports org skills, plugins and processes the platform has and the repo does not, onto a drift/&lt;date&gt; branch for review. Truncated or binary aux files are listed and marked partial. WDL keeps its own <code>workspace.py agent checkout</code> and <code>sync</code>.</li>
  <li><b>abcd audit drift</b>: the platform keeps no hashes, so abcd records its own at every push. Drift compares each live and staged object's SKILL.md hash and aux listing (paths and sizes), and each process's fields, with what bld_versions recorded for the last stage and release.</li>
  <li><b>Rebuilding from git:</b> <code>abcd builder setup</code> then <code>abcd release --redeploy &lt;agent&gt;@v&lt;n&gt;</code> restores every definition. --redeploy re-uploads an already released tag with no new gate run; a lead must approve it, and it is recorded like a rollback. Eval history and the knowledge graph live in the platform's tables and Doc Store, so the repo alone cannot restore them.</li></ul>
  <h2>Branches and teams</h2>
  <ul><li>FDEs work on branches and push them. abcd stage works from any pushed commit.</li>
  <li>abcd release requires the staged commit to be on the workspace's default branch (named in builder.json), so a release has always been through a merge. A lead can release from another branch with a recorded decision.</li>
  <li>Release tags (&lt;agent&gt;@v&lt;n&gt;, &lt;agent&gt;@v&lt;n&gt;-rc) and GitHub releases belong to the workspace repo, not to abcd. A tag always points at the staged commit that passed the gate.</li>
  <li>Changes reach the default branch only by pull request. Another FDE or a lead reviews and merges; nobody merges their own.</li>
  <li>A client built before the Builder gets a baseline with <code>abcd ws pull --adopt</code>: what is live is recorded as version 0 and tagged &lt;agent&gt;@v0 once merged, so drift and no_regression have something to compare against.</li>
  <li><b>No command, local or cloud, commits to the default branch.</b> What a release generates (the report, explainer, training kit and ADOPT.md refresh) goes to a release/&lt;agent&gt;@v&lt;n&gt; branch with a pull request.</li>
  <li>ADOPT.md holds the client and org, the agents in flight and their phase, the commands for this workspace, the approval rules, and what not to touch (WDL legacy, the default tier). abcd ws init generates it; abcd release refreshes its agent table on the release branch. The abcd-builder plugin is installed once per FDE machine, not per workspace.</li></ul>
  <h2>Where abcd runs: locally and in the cloud</h2>
  <table class="t"><tr><th></th><th>Local</th><th>Cloud</th></tr>${CLOUD_ROWS.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table>
  <h2>The abcd harness skill</h2>
  <p><code>harness-skills/abcd/</code> mirrors <code>harness-skills/noui/</code>, which ships NoUI to the harness today. ${ABCD}</p>
  <ul><li><b>SKILL.md</b>, frontmatter <code>name: abcd</code>. Teaches the agent to stage the bundle and run abcd in place, run <code>abcd cloud bootstrap</code> (which fails loudly, naming every missing variable), drive abcd only with bash and the same commands as locally, and never print a secret.</li>
  <li><b>build_bundle.py</b> builds abcd-bundle.zip from git-tracked files only: cli/ (NoUI included), abcd-builder/, adopt-skill-review/ and pyproject.toml. It leaves out workspaces/, tabby/ and every .env.</li>
  <li><b>Deployment:</b> <code>harness_skill.py push --aux abcd-bundle.zip=...</code> to the org tier of the Builder home org only. Never to the default tier, which every org sees.</li>
  <li><b>Checks:</b> the same frontmatter lint and content secret scan as every push, over SKILL.md and every bundle member.</li></ul>
  <h2>The Builder home org, one per client</h2>
  <div class="note rv"><b>Why it exists.</b> Sandbox secrets are org-wide: every sandbox in an org gets every SANDBOX_* secret, whichever process or user the turn belongs to. An Admin PAT in a client org's vault would reach the client's own agents. So the credentials live in an Adopt-owned org whose users are FDEs and leads, with no client users and no client-facing agents.<br><b>Why one per client.</b> Cloud runs read untrusted content (transcripts, emails, SME uploads). A shared home org would put every client's Admin PAT in reach of a prompt injection in any one client's material. One home org per client limits that to the client's own PAT and repo. A shared home org is acceptable only if that risk is accepted in writing.</div>
  <table class="t"><tr><th>Object</th><th>What it is</th></tr>
  <tr><td><b>Vault secrets</b></td><td>SANDBOX_ABCD_PAT_CLIENT_ID and SANDBOX_ABCD_PAT_SECRET (this client's Admin PAT), optional SANDBOX_ABCD_WEBUI_ENDPOINT, and SANDBOX_GITHUB_TOKEN, a fine-grained token scoped to this client's workspace repo.</td></tr>
  <tr><td><b>abcd-&lt;env&gt; workstream</b></td><td>One. Its Doc Store holds one file, abcd-workspace.json (env, repo, ref). The harness copies it into the sandbox, so a run knows its workspace without being told.</td></tr>
  <tr><td><b>abcd-runner</b></td><td>FDE-driven: it does what the chat asks. abcd release becomes a gated step, so the FDE's approval is a HITL answer in that chat.</td></tr>
  <tr><td><b>abcd-nightly</b></td><td>A cron pipeline on the abcd-&lt;env&gt; workstream: abcd ws pull --check, abcd audit drift, the blind gate on live when the agent's skills or a default skill it uses changed, abcd metric compute, abcd status publish, and the daily FDE report.</td></tr>
  <tr><td><b>abcd-weekly</b></td><td>The Friday scorecard, sent through the home org's Slack or Gmail integration.</td></tr></table>
  <ul><li><b>Pushing back:</b> a cloud run never changes the default branch. Code changes go to a pushed cloud/&lt;conversation&gt; branch. Pull requests and GitHub releases go through the GitHub REST API. Reports and status go to the Doc Store and tables.</li>
  <li><b>Approvals in the cloud:</b> the FDE's own chat turns are user_message events, so the browser-skill approval token and the release approval are both the FDE's own messages, never the agent's.</li>
  <li><b>Attribution:</b> a cloud run logs bld_dev_events as cloud:&lt;process&gt;, with ADOPT_CONVERSATION_ID, so the daily report can tell cloud runs from FDE runs.</li>
  <li><b>Short-lived sandboxes:</b> a sandbox is reaped after about 10 idle minutes and one bash call is capped at 60 minutes. Every run clones fresh at a pinned ref and writes its results out; abcd eval run is resumable.</li>
  <li><b>What stays in the client org:</b> the Builder workstreams, Doc Stores and tables, the staged and live objects, and the client-facing meta agents (Status agent, Context agent, maker-checker step). None of these hold credentials, and none of them call abcd.</li></ul>`;
}

function pWorkstreams() {
  return `<h1>Workstreams and folders</h1>
  <p class="lead">These live in the client org. <code>abcd builder setup</code> creates two standard workstreams per org and a status and SME workstream per client, using the existing workstream routes, and records their ids in the workspace's builder.json so every FDE and every cloud run finds them without listing. Datasets add a workstream per work-product pair, or one per labelled or read-your-writes dataset, and each client with a Builder agent gets a staging workstream. Client workstreams stay as they are.</p>
  <table class="t"><tr><th>Workstream</th><th>How many</th><th>Holds</th><th>Tables linked</th><th>Who writes and reads</th><th>Status</th></tr>
  ${WORKSTREAMS.map(w => `<tr><td><b>${esc(w.name)}</b><br><span class="tag">${esc(w.key)}</span><div style="color:var(--muted);font-size:12.5px">${esc(w.created)}</div></td><td>${esc(w.count)}</td><td>${esc(w.holds)}<div style="color:var(--muted);font-size:12.5px">Store: ${esc(w.store)}</div></td><td>${esc(w.tables)}</td><td>${esc(w.who)}</td><td>${st(w.status)}</td></tr>`).join('')}</table>
  <div class="note">Pair workstreams carry <code>custom_properties.kind = dataset</code> (an existing JSON field on workstreams, with its schema set once through member-config) so they can be kept out of client lists, Spaces and the email router.</div>
  <div class="note">The cloud runner's abcd-&lt;env&gt; workstreams live in the Builder home org, not here. See <a href="#workspaces" data-go="workspaces">Workspaces and cloud</a>.</div>
  <h2>Builder: context Doc Store</h2><p class="sub">Click a folder to fold it.</p><div class="tree">${tree(META_TREE)}</div>
  <h2>Builder: operations Doc Store</h2><div class="tree">${tree(OPS_TREE)}</div>
  <h2>Builder status: &lt;client&gt; Doc Store</h2><p class="sub">The only Builder files a client can see.</p><div class="tree">${tree(STATUS_TREE)}</div>
  <h2>Rules for every Builder folder</h2>
  <ul><li><b>Never overwrite.</b> The Doc Store has no version history (an override mints a new document id), so every versioned file gets a new path.</li>
  <li><b>Tables are the index.</b> Paths are stored in table rows, so nothing ever needs to list a Doc Store folder.</li>
  <li><b>Markdown for anything an agent reads,</b> HTML only for explainers and reports people open.</li>
  <li><b>Non-PDF uploads skip extraction,</b> so .md, .json and .jsonl cost nothing to store.</li></ul>`;
}

function pTables() {
  const groups = ['All', ...new Set(TABLES.map(t => t.group))];
  const list = TABLES.filter(t => state.tfilter === 'All' || t.group === state.tfilter);
  const t = TABLES.find(x => x.name === state.table) || TABLES[0];
  return `<h1>Data tables</h1>
  <p class="lead">${TABLES.length} Data Store custom tables hold the Builder's index. They are created once by <code>abcd builder setup</code> through the existing org-db API, and linked to the Builder workstreams.</p>
  <div class="seg">${groups.map(g => `<button class="${g === state.tfilter ? 'on' : ''}" data-tfilter="${g}">${g}</button>`).join('')}</div>
  <div class="split">
    <div class="list">${list.map(x => `<button class="${x.name === t.name ? 'on' : ''}" data-table="${x.name}"><span class="mono">${x.name}</span><span class="small">${esc(x.purpose)}</span></button>`).join('')}</div>
    <div class="card">
      <h3 class="mono">${t.name}</h3><p>${esc(t.purpose)}</p>
      <div class="kv" style="margin:8px 0 12px"><div class="k">Linked to</div><div>${esc(t.ws)}</div><div class="k">Unique key</div><div class="mono">${t.key}</div><div class="k">Written by</div><div>${esc(t.by)}</div><div class="k">Read by</div><div>${esc(t.reads)}</div></div>
      <table class="t"><tr><th>Column</th><th>Type</th><th>Note</th></tr>${t.cols.map(c => `<tr><td class="mono">${c.name}</td><td class="mono">${c.type}</td><td>${esc(c.note)}</td></tr>`).join('')}</table>
      <div class="meta">Every table also gets the platform's implicit columns: id, created_at, updated_at, is_deleted, metadata.</div>
    </div>
  </div>
  <h2>How the tables are set up, and why</h2>
  <table class="t"><tr><th>Setting</th><th>Why</th></tr>
  <tr><td><code>workstream_scoped = false</code></td><td>Rows written through the external API get workstream_id = null, which makes them invisible to agents on scoped tables. Unscoped tables linked to the Builder workstreams are visible to the meta agents.</td></tr>
  <tr><td>A unique key on every table</td><td>Inserts are not atomic and there is no upsert. abcd retries with the same key; a 409 means already written.</td></tr>
  <tr><td>Batches of at most 500 rows</td><td>The insert API limit.</td></tr>
  <tr><td>Status changes through abcd</td><td>Harness agents can insert and soft-delete rows but not update them. Version, release and status changes are made by abcd through the rows PATCH route.</td></tr>
  <tr><td>No client access to tables</td><td>Data Store has workstream-level, not user-level, row security, and read-only SQL is org-wide. Clients see files in their Builder status workstream instead.</td></tr>
  <tr><td>Enums are checked by abcd</td><td>The Data Store stores enum as plain text and does not enforce values.</td></tr>
  <tr><td>No answer ever sits in a table</td><td>Any agent under test with db_query can read the whole org. Expected values, labels, states, case notes and expected-versus-observed diffs live only in the ds-&lt;dataset&gt;, builder-sme and builder-ops Doc Stores; tables hold their paths and SHA-256 hashes.</td></tr>
  <tr><td>No dataset workstream is linked to a table</td><td>Each table is linked to its Builder workstream; the maker-checker step, the Context agent and the curator get their own links. A dataset workstream never does.</td></tr>
  </table>`;
}

function pDatasets() {
  const c = DS_CRUD[state.crud];
  const k = DS_KINDS.find(x => x.key === state.kind) || DS_KINDS[0];
  return `<h1>Datasets</h1>
  <p class="lead">A dataset is how an FDE says what "correct" means for an agent. Not every agent produces a document to compare against, so a dataset has a kind. Each kind says what a case holds, how the agent runs on it, and how the result is scored. An agent linked to a dataset cannot go live until it meets its release criteria on it.</p>
  <h2>Pick the kind that fits the agent</h2>
  <div class="seg">${DS_KINDS.map(x => `<button class="${x.key === k.key ? 'on' : ''}" data-kind="${x.key}">${x.name}</button>`).join('')}</div>
  <div class="card">
    <h3>${k.name} <span class="who-chip">Example: ${k.agent}</span></h3>
    <div class="kv" style="margin-top:8px">
      <div class="k">Use it when</div><div>${esc(k.when)}</div>
      <div class="k">A case holds</div><div>${esc(k.caseShape)}</div>
      <div class="k">Workstreams</div><div>${esc(k.layout)}</div>
      <div class="k">How it runs</div><div>${esc(k.run)}</div>
      <div class="k">How it is scored</div><div>${esc(k.score)}</div>
      <div class="k">Typical metrics</div><div>${esc(k.metrics)}</div>
      <div class="k">Where cases come from</div><div>${esc(k.source)}</div>
      <div class="k">Keeping it honest</div><div>${esc(k.isolate)}</div>
    </div>
    <div class="term" style="margin-top:12px">${esc(k.manifest)}</div>
  </div>
  <div class="note">Every kind shares one case shape: inputs, optional setup, expected, optional teardown, scorers, source and tags. A new kind is a new runner and scorer in abcd, not a new table or a platform change.</div>
  <h2>Scorers</h2>
  <table class="t"><tr><th>Scorer</th><th>Compares</th><th>Kinds</th></tr>
  <tr><td class="mono">field_match</td><td>Structured output fields, with tolerances for money and dates</td><td>work_product</td></tr>
  <tr><td class="mono">rubric</td><td>A document against a written rubric, judged by your coding agent</td><td>work_product, custom</td></tr>
  <tr><td class="mono">label_match</td><td>Each produced label with the expected one; feeds a confusion matrix</td><td>labeled</td></tr>
  <tr><td class="mono">boundary_match</td><td>Where documents were split against the expected page ranges</td><td>labeled</td></tr>
  <tr><td class="mono">state_match</td><td>Rows read back by the probe with the expected state</td><td>read_your_writes</td></tr>
  <tr><td class="mono">outcome_match</td><td>The write's result code class: updated, updated with a warning, refused</td><td>read_your_writes</td></tr>
  <tr><td class="mono">collateral</td><td>Rows in scope other than the target, before and after</td><td>read_your_writes</td></tr>
  <tr><td class="mono">script:&lt;name&gt;</td><td>Anything, through evals/scorers/&lt;name&gt;.py</td><td>custom</td></tr>
  <tr><td class="mono">check:&lt;check_key&gt;</td><td>Any client check from bld_checks</td><td>all</td></tr></table>
  <h2>How a dataset is stored</h2>
  <div class="tree">${tree(DS_TREE)}</div>
  <div class="note rv"><b>Why expectations live apart.</b> The harness copies every Doc Store linked to a workstream into the agent's sandbox. If expected outputs or labels sat in the dataset workstream, the agent under test could read the answers. They live in the dataset store, which is linked to Builder: operations only. For the same reason they never go in the workspace repo, which a cloud run clones into a sandbox.</div>
  <h2>How it is indexed</h2>
  <ul><li><span class="tag">bld_datasets</span> one row per dataset: kind, layout, run mode, test environment and probe, default scorers, current version.</li>
  <li><span class="tag">bld_dataset_versions</span> one row per version, with a change note and the immutable manifest path.</li>
  <li><span class="tag">bld_dataset_cases</span> one row per case: inputs, setup, the path and hash of what it expects (never the values), teardown, scorers, source, tags, and the versions it was active in.</li>
  <li>A <span class="tag">kg/datasets/&lt;dataset&gt;.md</span> page explains what the dataset covers, and a <span class="tag">tested_by</span> edge links each agent to it.</li></ul>
  <h2>Create, read, update, delete</h2>
  <div class="seg">${DS_CRUD.map((x, i) => `<button class="${i === state.crud ? 'on' : ''}" data-crud="${i}">${x.op}</button>`).join('')}</div>
  <div class="card"><h3>${c.op}</h3>
    <div class="kv"><div class="k">abcd</div><div><div class="term" style="margin:0">${esc(c.cmd)}</div></div>
    <div class="k">Platform routes</div><div><span class="tag">${esc(c.api)}</span></div>
    <div class="k">Underneath</div><div>${esc(c.under)}</div>
    <div class="k">Dataset version</div><div>${c.ver}</div></div></div>
  <h2>Rules</h2>
  <ul><li>Any change to cases or expectations creates a new dataset version. Two releases are only compared on the same version.</li>
  <li>Retired cases keep their files, so any past eval run can be reproduced.</li>
  <li>The staged agent is assigned to every dataset workstream when it is created, and never to a client workstream.</li>
  <li>Read-your-writes datasets run only against the declared test environment. Before the first case, abcd asks the probe which server and database it is connected to and refuses if it is not the declared one.</li>
  <li>Expectations and targets are owned by the FDE; abcd asks for a lead's recorded approval before loosening either.</li>
  <li>Every operation also writes the case files and manifest under <code>harness/datasets/&lt;dataset&gt;/</code> in the workspace, and commits them.</li>
  <li>For a browser skill compiled by NoUI, the goal NoUI recorded becomes a draft goal_reached check on every agent that uses it. The replay approval shows the operations worked once; the dataset shows the agent gets the right outcome. A release needs both.</li></ul>`;
}

function pKg() {
  return `<h1>Knowledge graph and context</h1>
  <p class="lead">The knowledge graph is the context a builder needs before touching an agent. It lives in the Builder: context workstream: pages in its Doc Store, which is backed by S3, and nodes and edges in two Data Store tables. No new storage system and no new platform feature.</p>
  <div class="grid g3">
    <div class="card"><div class="k">Pages</div><h3>Doc Store, markdown</h3><p>One page per entity, plus index.md, schema.md and an append-only log.md. Readable by people and agents.</p></div>
    <div class="card"><div class="k">Graph</div><h3>bld_kg_nodes, bld_kg_edges</h3><p>Typed links such as uses, calls, replaced_by, failed_on, tested_by. Answers "what does this change affect?"</p></div>
    <div class="card"><div class="k">Trust</div><h3>Proposed, then vetted</h3><p>Agents propose; FDEs vet. Follows the agent-memory spec's proposed and vetted tiers.</p></div>
  </div>
  <h2>Folder layout</h2><div class="tree">${tree(META_TREE)}</div>
  <h2>How context flows in</h2>
  <table class="t"><tr><th>Source</th><th>Lands in</th><th>What the Context curator does</th></tr>
  <tr><td>Call transcript</td><td><code>context/calls/&lt;client&gt;/&lt;date&gt;-&lt;slug&gt;.md</code></td><td>Extracts requirements, decisions and candidate checks, each linked to the call</td></tr>
  <tr><td>Email thread</td><td><code>context/emails/...</code></td><td>Same as calls</td></tr>
  <tr><td>SOP or playbook</td><td><code>context/process-docs/...</code></td><td>Proposes steps, sign-offs and HITL gates for the agent</td></tr>
  <tr><td>NoUI compile</td><td><code>kg/apis/&lt;system&gt;/...</code>, <code>kg/skills/...</code></td><td>One page per API, with auth and parameters, and a page for the compiled skill</td></tr>
  <tr><td>Runs and HITL answers</td><td><code>proposed/</code></td><td>abcd metric compute exports run summaries to proposed/; the Context curator turns recurring questions into candidate decisions or checks</td></tr>
  <tr><td>Releases</td><td><code>kg/agents/&lt;agent&gt;.md</code></td><td>Updates the agent page with the live version and its skills</td></tr></table>
  <h2>How the coding agent reads it</h2>
  <p><code>abcd context pull &lt;agent&gt;</code> fetches a bundle: the agent page and every page one or two edges away, its decisions, open items, checks, metrics and criteria. It lands in <code>workspaces/&lt;env&gt;/context/</code>, which the workspace repo ignores, so your coding agent reads it as local files. The Context curator is a process on builder-context; it needs no credentials, so it stays in the client org.</p>
  <div class="note">Constraints: Data Store has no per-user row security, so the graph is readable org-wide. The harness copies at most 200 MB of a workstream's files per session; larger graphs rely on index pages and fetching on demand.</div>`;
}

function pBlind() {
  return `<h1>Context gaps and blind evals</h1>
  <p class="lead">An agent is ready when it can reproduce the golden dataset blind: given only a generic prompt, the knowledge graph's instructions and its skills. During the build phase, the FDE and a customer-appointed SME keep adding the missing context and explanation until that is true. This is a requirement for every agent linked to a dataset.</p>
  <h2>What a blind eval gives the agent, and what it withholds</h2>
  <div class="grid g2">
    <div class="card"><div class="k">Given</div><ul><li>A generic prompt from the agent's <span class="tag">prompts.yaml</span>, such as "Prepare the 1120-PC for this client from the files in this workstream"</li><li>The case inputs, exactly as a client would provide them</li><li>The compiled instruction skill (<span class="tag">&lt;agent&gt;-instructions</span>) and the agent's other skills</li><li>Client-scope instructions synced into the case workstream</li></ul></div>
    <div class="card"><div class="k">Withheld</div><ul><li>Expected outputs, labels and states</li><li>Case notes (<span class="tag">bld_case_notes</span>)</li><li>Gap files and their evidence</li><li>Any FDE message, hint or follow-up turn</li><li>Answers to questions the agent asks: a question in a blind run is itself a context gap</li></ul></div>
  </div>
  <h2>The gap loop</h2>
  <ol class="steps">
    <li><b>Blind run.</b> abcd eval run --blind scores every case against the golden dataset.</li>
    <li><b>Classify misses.</b> The context-gaps skill sorts each miss: missing context, skill bug, rounding, playbook difference, or real error. Only missing context opens a gap; the rest become build plan items.</li>
    <li><b>Open a gap.</b> One row in <span class="tag">bld_context_gaps</span> and one evidence file <span class="tag">gaps/&lt;gap_id&gt;.md</span>: the case input excerpt, the agent output against the golden output, the agent's reasoning, and the Builder's hypothesis of what is missing.</li>
    <li><b>Route it.</b> The FDE answers from what they know, or sends it to the SME (abcd gap ask). The SME sees it in their Builder SME workstream and by email.</li>
    <li><b>Answer.</b> The SME works through it with the Context agent, which asks follow-ups until the answer is a rule, not a one-off. Case-specific explanations are saved as repro notes.</li>
    <li><b>Encode.</b> The context-gaps skill turns the answer into a generic instruction page under <span class="tag">kg/instructions/&lt;agent&gt;/</span>, with its provenance. The FDE or SME vets it.</li>
    <li><b>Leak check.</b> abcd refuses an instruction that names a case id, quotes a value from any expected output, or only makes sense for one case.</li>
    <li><b>Compile and re-run.</b> abcd instructions compile builds the instruction skill into the workspace at <span class="tag">harness/skills/&lt;agent&gt;-instructions/</span> and commits it. The affected cases and then the full set re-run blind.</li>
    <li><b>Verify.</b> The gap closes only when a blind run reproduces its case without regressing any other. Otherwise it goes back to open with the new evidence.</li>
  </ol>
  <h2>Gap states</h2>
  <div class="grid g5">
    <div class="card"><span class="pill p-dr">Open</span><p style="margin-top:8px">Found by a blind run. With the Builder.</p></div>
    <div class="card"><span class="pill p-rv">Asked</span><p style="margin-top:8px">Waiting on the SME or FDE.</p></div>
    <div class="card"><span class="pill p-dr">Answered, encoded</span><p style="margin-top:8px">Turned into an instruction; waiting for a blind re-run.</p></div>
    <div class="card"><span class="pill p-ok">Verified</span><p style="margin-top:8px">A blind run reproduced the case.</p></div>
    <div class="card"><span class="pill p-dr">Waived</span><p style="margin-top:8px">A lead accepted the miss, with a recorded reason. Counted on the scorecard.</p></div>
  </div>
  <h2>How instructions reach the agent, with no platform change</h2>
  <table class="t"><tr><th>Scope</th><th>Where it lives</th><th>How the agent gets it</th></tr>
  <tr><td>Org or agent</td><td><code>kg/instructions/&lt;agent&gt;/&lt;topic&gt;.md</code> in Builder: context</td><td>Compiled into the <code>&lt;agent&gt;-instructions</code> skill (references/ files plus an index in SKILL.md). Versioned, staged and released like any skill.</td></tr>
  <tr><td>Client</td><td>The same folder, with scope = client</td><td>abcd syncs them into <code>_builder/instructions/</code> in that client's workstream and its dataset workstreams, so the harness stages them with the client's files.</td></tr></table>
  <h2>Build phase exit criteria</h2>
  <ul><li>Every active case reproduces blind, or its gap is waived with a reason a lead approved.</li>
  <li>No open, asked or encoded gaps.</li>
  <li>No instruction with a flagged leak check.</li>
  <li>The blind reproduction rate meets its release criterion, which is mandatory for every agent linked to a dataset.</li></ul>
  <h2>Metrics this adds</h2>
  <table class="t"><tr><th>Metric</th><th>Definition</th></tr>
  <tr><td>Blind reproduction rate</td><td>Share of active cases a blind run reproduces. A gate metric for every linked agent.</td></tr>
  <tr><td>Open gaps, by owner</td><td>Gaps open, asked or encoded, split by FDE and SME. Shown on the scorecard.</td></tr>
  <tr><td>Time to close a gap</td><td>Opened to verified, in days.</td></tr>
  <tr><td>Instructions per agent</td><td>Vetted instructions in the compiled skill, and how many gaps each closed.</td></tr></table>`;
}

function pMetrics() {
  return `<h1>Metrics, checks and release criteria</h1>
  <p class="lead">Metrics are defined before the first build, versioned, and computed by the platform from the same data every time. The first pilot is why: different dashboards and emails gave different numbers, and the client did not trust the accuracy definition.</p>
  <h2>Rules the Builder enforces</h2>
  <div class="grid g2">
    <div class="card"><h3>Gated evals are blind</h3><p>Every gated eval gives the agent only a generic prompt, the compiled instructions and its skills. The blind reproduction rate is a mandatory release criterion for any agent linked to a dataset.</p></div>
    <div class="card"><h3>Accuracy is defined by checks</h3><p>An output is accurate when it passes all of the client's checks. When a check is added, past runs are re-scored so trends stay comparable.</p></div>
    <div class="card"><h3>Every metric must be able to fail</h3><p>First-pass yield is the share of clients passing all checks on the first run with no human correction. A definition that is 100% by construction is refused.</p></div>
    <div class="card"><h3>Human time comes from logs</h3><p>From platform logs of user actions, split by onshore and offshore role. Nobody sits and watches screens.</p></div>
    <div class="card"><h3>One scorecard</h3><p>The release eval report and the client scorecard come from the same definitions and the same numbers. Misses are broken down by cause automatically.</p></div>
  </div>
  <h2>Example: a 1120-PC return prep agent</h2>
  <p class="sub">Definitions and UAT 1 values from a pilot scorecard, as an example. "To agree" marks values the scorecard still left open.</p>
  <table class="t"><tr><th>Metric</th><th>Category</th><th>Gate</th><th>Definition</th><th class="num">Baseline</th><th class="num">UAT 1</th><th class="num">Pilot target</th></tr>
  ${PILOT_METRICS.map(m => `<tr><td><b>${m.m}</b> <span style="color:var(--muted)">(${m.unit})</span></td><td>${m.cat}</td><td>${m.gate ? '<span class="pill p-dr">Gate</span>' : ''}</td><td>${esc(m.def)}</td><td class="num">${m.base}</td><td class="num">${m.uat1}</td><td class="num">${m.target}</td></tr>`).join('')}</table>
  <h2>A metric definition</h2>
  <p class="sub">In <code>harness/agents/acme-1120pc-prep/metrics.yaml</code>, mirrored to bld_metrics.</p>
  <div class="term">metric: acme-1120pc:first_pass_yield
version: 1
category: quality
unit: "%"
formula: clients passing all blocking checks on run 1 with zero human corrections / clients completed
source: [check_results, hitl_events, user_actions]
baseline: null
gate: true
signed_off: decision acme-d-042 (10/20 call)</div>
  <h2>Release criteria for the next release</h2>
  <p class="sub">In <code>harness/agents/acme-1120pc-prep/release.yaml</code>, mirrored to bld_release_criteria.</p>
  <div class="term">agent: acme-1120pc-prep
dataset: acme-1120pc@4
criteria:
  - metric: accuracy          comparator: ">="           target: 95
  - metric: first_pass_yield  comparator: ">="           target: 75
  - metric: human_time        comparator: "<="           target: 9.2
  - metric: blind_repro_rate  comparator: ">="           target: 95   (mandatory)
  - metric: open_gaps         comparator: "<="           target: 0
  - metric: all_cases         comparator: no_regression</div>
  <div class="note">Illustrative targets. The real targets are set by the FDE and agreed with the client as a recorded decision.</div>
  <h2>Checks</h2>
  <p>A check is either <b>deterministic</b> (a rule over the output, such as "every headline value within $2 of the filed return") or <b>judged</b> (a rubric scored by your coding agent locally, or by the harness agent in the cloud, used only where a rule cannot express it). Each lives in <code>harness/checks/&lt;check&gt;.yaml</code>. Every check runs twice: in evals, against expected outputs, and in production, as a maker-checker step before a person sees the output.</p>`;
}

function pVersions() {
  return `<h1>Versions, git and releases</h1>
  <p class="lead">The workspace repo is the version store. On the platform, every skill, plugin and agent has a live object and a shadow staged object. Staging pushes to the shadow; releasing copies the staged bundle onto the live names. No platform change is needed.</p>
  <h2>Version states</h2>
  <div class="grid g5">
    <div class="card"><span class="pill p-dr">Draft</span><p style="margin-top:8px">A commit on a branch of the workspace repo, pushed to the shadow staged objects while you iterate.</p></div>
    <div class="card"><span class="pill p-dr">Staged</span><p style="margin-top:8px">Passed evals. Hashes recorded in bld_versions; commit tagged &lt;agent&gt;@v&lt;n&gt;-rc.</p></div>
    <div class="card"><span class="pill p-ok">Live</span><p style="margin-top:8px">Passed the gate. Uploaded under the live names; the staged commit, on the default branch, tagged &lt;agent&gt;@v&lt;n&gt;.</p></div>
    <div class="card"><span class="pill p-dr">Superseded</span><p style="margin-top:8px">A previous live version. Its tag is the rollback target.</p></div>
    <div class="card"><span class="pill p-ex">Gate failed</span><p style="margin-top:8px">The release was refused. Nothing changed under the live names.</p></div>
  </div>
  <h2>Live and staged objects on the platform</h2>
  <table class="t"><tr><th>Object</th><th>Source in the workspace</th><th>Live</th><th>Staged shadow</th><th>Assigned to</th></tr>
  <tr><td>Skill</td><td><code>harness/skills/tb-reconcile/</code></td><td><code>tb-reconcile</code></td><td><code>tb-reconcile--staged</code>; frontmatter name, compiled_flow and agent_instructions references rewritten, because the catalog keys skills by frontmatter name; process: block dropped; description "Staging copy, do not use"</td><td>n/a</td></tr>
  <tr><td>Plugin</td><td><code>harness/plugins/&lt;plugin&gt;/</code></td><td><code>&lt;plugin&gt;</code></td><td><code>&lt;plugin&gt;--staged</code>, with its skills renamed the same way</td><td>n/a</td></tr>
  <tr><td>Agent (process)</td><td><code>harness/agents/acme-1120pc-prep/</code></td><td><code>acme-1120pc-prep</code></td><td><code>acme-1120pc-prep-staged</code>, display name "Return prep (staged)"; components point at the --staged skills</td><td>Live: client workstream. Staged: staging and dataset workstreams only, so no client user sees it</td></tr>
  </table>
  <h2>What changes in a staged copy</h2>
  <p>The staged copy is built in a temporary directory from the workspace, so the workspace never holds --staged names.</p>
  <ul><li>The frontmatter name and the references to other renamed objects are rewritten.</li>
  <li>The frontmatter process: block is dropped, so a staged skill does not add a second process template.</li>
  <li>The description starts "Staging copy, do not use".</li>
  <li>For a NoUI skill, operations.json, manifest.json, amendments.json, replay_approval.json and recording_bundle.json (restored from the noui-bundles store) are copied byte for byte, so every digest still matches.</li></ul>
  <h2>The browser-skill gate</h2>
  <p>It runs on every push of a browser skill, staged or live, not only at stage. The upload route checks nothing, so abcd applies the platform's full rule itself:</p>
  <ol class="steps"><li><code>noui_core.verify.gate.check_installable</code> passes: replay_approval.json matches the fingerprint of the operations and amendments being pushed.</li>
  <li>A member approval token with that fingerprint, <code>&lt;!--adopt:skill-approval v="1" fp="..."--&gt;</code>, is in a user_message of the conversation recorded in the approval. abcd reads it through the conversation transcript route.</li></ol>
  <div class="note">A replay approved in a local NoUI run has no token. It is accepted only with <code>--local-approval</code>, which records the FDE as the approver in bld_versions, and the eval report shows it as a local approval.</div>
  <h2>abcd stage refuses when</h2>
  <ul><li>the tree has uncommitted changes, or the commit is not pushed;</li>
  <li><code>harness_skill.py audit</code> exits non-zero (1 for medium or high findings, 2 for critical) on any skill in the bundle, or the secret scan fails. This is stricter than push, which blocks only on 2;</li>
  <li>a browser skill fails the gate above (a changed operation needs a new replay and approval);</li>
  <li>another FDE holds the agent's staged lock.</li></ul>
  <h2>Platform limits and how abcd works around them</h2>
  <table class="t"><tr><th>Need</th><th>Platform today</th><th>How abcd covers it</th><th>What remains</th></tr>${WORKAROUNDS.map(w => `<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[1])}</td><td>${esc(w[2])}</td><td>${esc(w[3])}</td></tr>`).join('')}</table>
  <h2>The workspace repo</h2>
  <p>One private repo per client workspace, at <code>workspaces/&lt;env&gt;/</code>. abcd uses git and the gh CLI; the platform never talks to GitHub. Tags and GitHub releases belong to the workspace repo, not to abcd. The full layout is on <a href="#workspaces" data-go="workspaces">Workspaces and cloud</a>.</p>
  <h2>What abcd release does, in order</h2>
  <ol class="steps">
    <li>Re-checks that the shadows still match the staged hashes, and runs abcd audit drift on the live objects.</li>
    <li>Checks that the staged commit is on the default branch, and that no skill name collides with a default-tier skill without a recorded decision. A name released for the first time is uploaded without replace, so the platform's own collision guard also applies.</li>
    <li>Checks every release criterion against the blind staged run on those exact hashes, for this agent and every agent that shares a changed skill. Refuses on any failure or any error.</li>
    <li>Asks the FDE to approve. In the cloud, this is a HITL step in the abcd-runner chat.</li>
    <li>Uploads each staged bundle under its live name (replace = true), with the names, process: block and description restored. Patches the live process, including its workstreams and write grants. Verifies what landed.</li>
    <li>Writes the eval report to <code>releases/&lt;agent&gt;/&lt;version&gt;/</code> in builder-ops, copies it to the client's status workstream, and writes it to <code>harness/evals/reports/</code> on a <code>release/&lt;agent&gt;@v&lt;n&gt;</code> branch.</li>
    <li>Records the release in <span class="tag">bld_releases</span> with the previous tag as the rollback target, and the bundle_version of every default-tier skill the agent uses.</li>
    <li>Tags the staged commit <code>acme-1120pc-prep@v13</code> in the workspace repo, and attaches the report to a GitHub release on that repo (gh locally, the GitHub REST API in the cloud).</li>
    <li>Regenerates the explainer and training kit, refreshes ADOPT.md, commits them to the same release/&lt;agent&gt;@v&lt;n&gt; branch, and opens a pull request. Nothing is committed to the default branch.</li>
  </ol>
  <p><b>Rollback:</b> <code>abcd rollback &lt;agent&gt;</code> re-uploads the previous tag's bundles under the live names, patches the live process, verifies, and records the rollback.</p>
  <h2>The default tier</h2>
  <ul><li>Client workspaces release to the org tier only. abcd release never calls deploy-default.</li>
  <li>The default tier holds abcd's own <code>harness-skills/*</code> (today, noui). They are released by abcd's CI, outside the workspace flow.</li>
  <li>An org skill named like a default skill hides the default for the whole org, so abcd release refuses one without a lead's decision.</li></ul>
  <div class="note"><b>WDL objects</b> are outside all of this. They keep save_wdl_draft.py, publish_wdl_action.py and rollback_changes.py, and their history is the workspace repo's history.</div>`;
}

    <div class="portal-bar"><div class="brand-tile" style="width:24px;height:24px">${LOGO}</div><b>Acme</b><span style="color:var(--muted)">Builder status: acme · signed in as a client stakeholder · read only</span></div>
    <div class="portal-body">
      <div class="seg">${agents.map((x, i) => `<button class="${i === state.agent ? 'on' : ''}" data-agent="${i}">${x.name}</button>`).join('')}</div>
      <div class="seg">${tabs.map(t => `<button class="${t === state.ptab ? 'on' : ''}" data-ptab="${t}">${t}</button>`).join('')}</div>
      ${body}
    </div>
  </div>
  <h2>How it works</h2>
  <ul><li>The client logs in as an Operator user with a read grant on their Builder status workstream, and opens it in the end-user Agents cockpit, which shows the workstream's files.</li>
  <li><code>abcd status publish</code>, in the nightly cloud run (abcd-nightly in the Builder home org), writes <code>scorecard.md</code> and each agent's <code>status.md</code> into that workstream through the Doc Store routes. abcd release copies each eval report there. abcd-weekly freezes a scorecard every Friday.</li>
  <li>The Status agent, assigned to that workstream, answers questions from those files. It can read nothing else.</li>
  <li>The Friday scorecard also goes out by email or Slack through the home org's integration, so a client can follow along without logging in.</li>
  <li>Leads get the same files for every client, plus every FDE's daily report: workspaces and agents touched, time per loop step, releases and their scores, platform spend (FDE turns and cloud runs, separately), and where they got stuck.</li></ul>`;
}

function pTraining() {
  const kit = {
    prompts: `<table class="t"><tr><th>Prompt</th><th>What it does</th></tr>
      <tr><td>"Prepare the 1120-PC for Acme Holdings from the files in this workstream."</td><td>Runs all 7 steps; stops for review at the sign-off gates.</td></tr>
      <tr><td>"Which checks did Acme's return fail, and why?"</td><td>Lists failed checks with expected and found values.</td></tr>
      <tr><td>"I uploaded a corrected trial balance. Redo reconciliation."</td><td>Resumes at the reconciliation step, not step 1.</td></tr>
      <tr><td>"Show what changed between your draft and the filed values."</td><td>A side-by-side of headline values.</td></tr>
      <tr><td>"Summarise what still needs a person on this client."</td><td>Open HITL items, in order.</td></tr></table>`,
    quickstart: `<ol class="steps"><li>Open the client's workstream and check the year's files are in place.</li><li>Ask the agent to prepare the return.</li><li>Answer the questions it raises; each answer is remembered for this client.</li><li>Review the flagged lines, then sign off.</li><li>Ask "what changed?" any time to see your edits against the agent's draft.</li></ol>`,
    scenarios: `<div class="grid g2"><div class="card"><h3>A multi-entity client</h3><p>How the agent splits entities, what it asks, and how to correct an allocation.</p></div><div class="card"><h3>A missing prior-year return</h3><p>What the agent does without it and how to supply it later.</p></div><div class="card"><h3>A check fails</h3><p>Reading the failure and fixing the input or the line.</p></div><div class="card"><h3>Handing over mid-way</h3><p>Picking up a client someone else started.</p></div></div>`,
    'whats-new': `<div class="card"><div class="k">v13</div><p>Multi-entity clients no longer stop at reconciliation. The agent now splits the trial balance by entity before matching, and asks only when an account can't be assigned.</p></div>`,
  };
  const keys = ['prompts', 'quickstart', 'scenarios', 'whats-new'];
  const labels = { prompts: 'Simple prompts', quickstart: 'Quickstart', scenarios: 'Scenarios', 'whats-new': 'What changed' };
  return `<h1>Explainers and training</h1>
  <p class="lead">Understanding is a feature of the Builder. Every agent always has an explainer of its current implementation and a training kit for its users, regenerated on every release by abcd explain and abcd train, in the FDE's coding agent, or in the cloud runner when the release ran there.</p>
  <div class="grid g2">
    <div class="card"><div class="k">For FDEs</div><h3>explainer.html</h3><p>An interactive page like this one, for one agent: its steps, skills and versions, datasets and criteria, checks, last eval, open items, and scenarios to walk through. Regenerated on every release, so it never drifts from what runs.</p><div class="meta"><span class="tag">harness/agents/&lt;agent&gt;/docs/explainer.html</span> in the workspace repo; <span class="tag">agents/&lt;agent&gt;/explainer.html</span> in Builder: context</div></div>
    <div class="card"><div class="k">For the agent's users</div><h3>The training kit</h3><p>Quickstart, simple prompts, worked scenarios, FAQ drawn from real questions in runs and HITL, and a plain-words note on what changed. Shipped with every release.</p><div class="meta"><span class="tag">harness/agents/&lt;agent&gt;/training/</span> in the workspace repo</div></div>
  </div>
  <h2>Example training kit: Return prep (1120-PC)</h2>
  <div class="seg">${keys.map(k => `<button class="${k === state.train ? 'on' : ''}" data-train="${k}">${labels[k]}</button>`).join('')}</div>
  ${kit[state.train]}
  <div class="note">Illustrative content for an example agent.</div>
  <h2>Rules</h2>
  <ul><li>abcd release regenerates the explainer and the kit. A release whose kit fails to generate is flagged, not blocked.</li>
  <li>Prompts in the kit are tested: each runs on a dataset case during the staged test, and only prompts that work ship.</li>
  <li>The FAQ comes from real questions users asked in runs and HITL, not invented ones.</li></ul>`;
}

function pQuestions() {
  return `<h1>Open questions</h1>
  <p class="lead">These need a decision before the requirements freeze. Each becomes a recorded decision once settled.</p>
  <table class="t"><tr><th>#</th><th>Question</th><th>Detail</th><th>Status</th></tr>${OPEN_Q.map((q, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(q[0])}</b></td><td>${esc(q[1])}</td><td>${DEC}</td></tr>`).join('')}</table>
  <div class="note rv">Separately, <code>/v1/end-user/docstore/*</code> authenticates only optionally, so a request with no bearer token can upload and delete. That is a security fix for the platform team, not an open question for the Builder.</div>`;
}

/* Events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-step],[data-scen],[data-sstep],[data-table],[data-tfilter],[data-role],[data-agent],[data-ptab],[data-crud],[data-train],[data-kind],[data-tree],#theme');
  if (!el) return;
  const d = el.dataset;
  if (el.id === 'theme') {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    if (root.dataset.theme === 'light') delete root.dataset.theme;
    nav(); return;
  }
  if (d.tree) { const k = el.nextElementSibling; if (k) { k.classList.toggle('closed'); el.querySelector('.caret').textContent = k.classList.contains('closed') ? '▸' : '▾'; } return; }
  if (d.go) { location.hash = d.go; document.getElementById('panel').scrollTop = 0; return; }
  if (d.step !== undefined) state.step = +d.step;
  if (d.scen !== undefined) { state.scen = +d.scen; state.sstep = 0; }
  if (d.sstep !== undefined) state.sstep = +d.sstep;
  if (d.table) state.table = d.table;
  if (d.tfilter) { state.tfilter = d.tfilter; const f = TABLES.filter(t => d.tfilter === 'All' || t.group === d.tfilter); if (f.length && !f.find(t => t.name === state.table)) state.table = f[0].name; }
  if (d.role !== undefined) state.role = +d.role;
  if (d.agent !== undefined) state.agent = +d.agent;
  if (d.ptab) state.ptab = d.ptab;
  if (d.crud !== undefined) state.crud = +d.crud;
  if (d.train) state.train = d.train;
  if (d.kind) state.kind = d.kind;
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
