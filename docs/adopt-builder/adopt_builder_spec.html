<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adopt Builder: how agents are built, tested and released</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
/* Ledger Ink tokens, inlined from adoptwebui docs/design-language/tokens.css */
:root {
  --frame: #ebeae5; --paper: #f8f8f6; --canvas: #efeee9; --sunken: #f2f2ef; --surface: #ffffff; --raised: #ffffff; --hover: #f0f0ec;
  --line: #e4e3df; --line-strong: #d3d2cd;
  --text: #1a1c1f; --muted: #63666b; --faint: #8a8d92;
  --ink: #15171a; --ink-hover: #2c2f34; --on-ink: #ffffff; --sel-bg: var(--ink); --sel-fg: var(--on-ink); --sel-line: var(--ink);
  --accent: #1f4e8c; --accent-hover: #183f72; --accent-soft: rgba(31, 78, 140, .08); --accent-line: rgba(31, 78, 140, .30); --accent-2: #a9bedb;
  --term-bg: #0f172a; --term-line: #1e293b; --term-rule: rgba(148, 163, 184, .12);
  --term-text: #e2e8f0; --term-muted: #94a3b8; --term-out: #cbd5e1;
  --term-err: #fca5a5; --term-err-bg: rgba(239, 68, 68, .12); --term-link: #93c5fd;
  --ok: #2f6b45; --ok-bg: #e7f0e9; --rv: #8a5a12; --rv-bg: #f6eedf; --ex: #a3291f; --ex-bg: #f8e6e3; --dr: #5f6368; --dr-bg: #eeeeeb;
  --skel: #efeee9;
  --shadow-card: 0 1px 2px rgba(20, 22, 26, .04);
  --shadow-pop: 0 10px 30px rgba(20, 22, 26, .12), 0 2px 6px rgba(20, 22, 26, .06);
  --scrim: rgba(17, 18, 20, .30);
  --bubble: #1f2226; --on-bubble: #ffffff; --logo-tile: #ffffff;
  --sheet: #ffffff; --sheet-ink: #1d1d1f; --sheet-mute: #5c5f64; --sheet-rule: #d9d9d6; --sheet-fill: #f2f2ef; --sheet-hl: #fbe7b5; --sheet-ev: #cfe0f7; --pv-canvas: #e6e6e3;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-pill: 4px; --r-btn: 6px; --r-card: 10px; --r-modal: 12px;
  --t-fast: .12s; --t-base: .2s;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --frame: #0b0c0e; --paper: #111214; --canvas: #16171b; --sunken: #15161a; --surface: #191b1e; --raised: #1f2125; --hover: #202226;
  --line: #2a2c31; --line-strong: #3a3d43;
  --text: #e8e9eb; --muted: #9a9ea5; --faint: #7b7f86;
  --ink: #34373e; --ink-hover: #3d4048; --on-ink: #f2f3f5; --sel-bg: #30333a; --sel-fg: #eceef0; --sel-line: #4a4e56;
  --accent: #86abdf; --accent-hover: #a3c0e8; --accent-soft: rgba(134, 171, 223, .14); --accent-line: rgba(134, 171, 223, .38); --accent-2: #3f5878;
  --ok: #7fc296; --ok-bg: rgba(127, 194, 150, .14); --rv: #dcae5e; --rv-bg: rgba(220, 174, 94, .15); --ex: #ec8a7e; --ex-bg: rgba(236, 138, 126, .15); --dr: #a7aab0; --dr-bg: rgba(167, 170, 176, .12);
  --skel: #222428; --shadow-card: none; --shadow-pop: 0 14px 36px rgba(0, 0, 0, .55), 0 0 0 1px #2e3136; --scrim: rgba(0, 0, 0, .55);
  --bubble: #2b2e34; --on-bubble: #eceef0; --logo-tile: var(--raised); --pv-canvas: #0d0e10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--frame); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 4px; }

.shell { display: flex; height: 100vh; }
.side { width: 256px; flex: none; display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 14px; cursor: pointer; }
.brand-tile { width: 30px; height: 30px; border-radius: 8px; background: var(--logo-tile); display: grid; place-items: center; box-shadow: var(--shadow-card); }
.brand-name { font-weight: 600; font-size: 14px; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav-group { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; padding: 14px 10px 4px; }
.nav-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: var(--text); font: inherit; font-size: 13.5px; padding: 6px 10px; border-radius: var(--r-btn); cursor: pointer; transition: background var(--t-fast); }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-card); }
.side-foot { margin-top: auto; padding: 12px 10px 4px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.side-foot .who { font-size: 12.5px; color: var(--muted); }
.icon-btn { width: 32px; height: 32px; border: none; background: none; color: var(--text); border-radius: var(--r-btn); cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: var(--hover); }

.panel { flex: 1; margin: 10px 10px 10px 0; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); overflow-y: auto; }
.page { max-width: 1180px; padding: 36px 44px 80px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 10px; }
.lead { font-size: 15.5px; color: var(--text); max-width: 820px; margin: 0 0 22px; }
.sub { color: var(--muted); max-width: 820px; }
h2 { font-size: 17px; font-weight: 600; margin: 34px 0 10px; }
h3 { font-size: 14.5px; font-weight: 600; margin: 0 0 6px; }
p { margin: 0 0 10px; max-width: 860px; }
ul, ol { margin: 0 0 12px; padding-left: 20px; max-width: 860px; }
li { margin: 3px 0; }

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 16px 18px; }
.card .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.card p, .card li { color: var(--text); font-size: 13.5px; }
.card .meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.card.click { cursor: pointer; transition: border-color var(--t-fast); }
.card.click:hover { border-color: var(--line-strong); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; white-space: nowrap; vertical-align: middle; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { color: var(--ok); background: var(--ok-bg); }
.p-rv { color: var(--rv); background: var(--rv-bg); }
.p-ex { color: var(--ex); background: var(--ex-bg); }
.p-dr { color: var(--dr); background: var(--dr-bg); }
.tag { display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 6px; margin: 1px 2px 1px 0; }

table.t { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; font-size: 13px; margin: 6px 0 14px; }
table.t th { background: var(--sunken); color: var(--muted); font-weight: 500; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: none; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--hover); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-btn); overflow: hidden; background: var(--surface); margin: 0 6px 10px 0; flex-wrap: wrap; }
.seg button { border: none; background: none; font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer; color: var(--text); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--sel-bg); color: var(--sel-fg); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: var(--r-btn); cursor: pointer; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-hover); }
.btn:disabled { opacity: .45; cursor: default; }
.input { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: var(--r-btn); width: 260px; }

.term { background: var(--term-bg); border: 1px solid var(--term-line); color: var(--term-text); border-radius: var(--r-card); padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow-x: auto; white-space: pre; margin: 6px 0 14px; }
.term .c { color: var(--term-muted); }
.term .o { color: var(--term-out); }
.term .l { color: var(--term-link); }
.term .e { color: var(--term-err); }

.tree { font-family: var(--mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 6px; }
.tree .row { display: flex; gap: 12px; padding: 3px 8px; border-radius: var(--r-pill); cursor: default; }
.tree .row.dir { cursor: pointer; }
.tree .row:hover { background: var(--hover); }
.tree .name { white-space: nowrap; }
.tree .desc { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
.tree .kids { margin-left: 18px; border-left: 1px solid var(--line); }
.tree .kids.closed { display: none; }
.caret { display: inline-block; width: 12px; color: var(--faint); }

.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; align-items: start; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.list button { display: block; width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; }
.list button:last-child { border-bottom: none; }
.list button:hover { background: var(--hover); }
.list button.on { background: var(--accent-soft); }
.list button .small { display: block; font-size: 12px; color: var(--muted); }

.loop { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin: 8px 0 14px; }
.loop button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-btn); padding: 8px 6px; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; text-align: left; min-height: 64px; }
.loop button .n { display: block; font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.loop button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.loop button.plat { background: var(--sunken); }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); vertical-align: -2px; margin-right: 6px; }

.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.kv .k { color: var(--muted); }
.note { border-left: 3px solid var(--line-strong); padding: 6px 12px; color: var(--muted); font-size: 13px; margin: 8px 0 14px; max-width: 860px; background: var(--surface); border-radius: 0 var(--r-btn) var(--r-btn) 0; }
.note.rv { border-left-color: var(--rv); }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps li { counter-increment: s; position: relative; padding: 8px 12px 8px 40px; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface); margin: 6px 0; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 8px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps li.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.steps li.future { opacity: .55; }
.who-chip { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 6px; margin-left: 6px; }

.portal { border: 1px solid var(--line-strong); border-radius: var(--r-modal); overflow: hidden; background: var(--frame); }
.portal-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunken); font-size: 13px; }
.portal-body { padding: 18px; background: var(--paper); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .d { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--ink); }

.report { background: var(--sheet); color: var(--sheet-ink); border: 1px solid var(--sheet-rule); border-radius: var(--r-card); padding: 22px 26px; }
.report .rh { display: flex; justify-content: space-between; border-bottom: 1px solid var(--sheet-rule); padding-bottom: 10px; margin-bottom: 12px; }
.report .muted { color: var(--sheet-mute); font-size: 12.5px; }
.report table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0 14px; }
.report th { text-align: left; color: var(--sheet-mute); font-weight: 500; border-bottom: 1px solid var(--sheet-rule); padding: 5px 6px; }
.report td { border-bottom: 1px solid var(--sheet-rule); padding: 5px 6px; }
.report td.num, .report th.num { text-align: right; font-variant-numeric: tabular-nums; }
.report h4 { font-size: 13px; margin: 14px 0 4px; }

.matrix td.c { text-align: center; }
.yes { color: var(--ok); font-weight: 600; }
.part { color: var(--rv); font-weight: 600; }
.no { color: var(--faint); }
.hl td { background: var(--accent-soft); }

@media (max-width: 1000px) {
  .side { display: none; }
  .panel { margin: 0; border-radius: 0; }
  .page { padding: 24px 18px 60px; }
  .g3, .g5, .g2, .split { grid-template-columns: 1fr; }
  .loop { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
</style>
</head>

  <aside class="side" id="side"></aside>
  <main class="panel" id="panel"><div class="page" id="page"></div></main>
</div>

const FDE_DOES = [

function tree(nodes) {

}

    <h3>Step ${s.n} · ${s.name} <span class="who-chip">${s.who}</span> <span class="who-chip">${s.where === 'local' ? 'Your subscription' : 'Platform tokens'}</span></h3>
    <p>${s.what}</p>
    <div class="kv" style="margin-top:10px">
      <div class="k">abcd</div><div><div class="term" style="margin:0">${esc(s.cmd)}</div></div>
      <div class="k">Platform routes</div><div><span class="tag">${esc(s.api)}</span></div>

    <div style="margin-top:12px; display:flex; gap:8px"><button class="btn" data-step="${Math.max(0, state.step - 1)}" ${state.step === 0 ? 'disabled' : ''}>Previous step</button><button class="btn" data-step="${Math.min(9, state.step + 1)}" ${state.step === 9 ? 'disabled' : ''}>Next step</button></div>
  </div>

function pBlind() {
  return `<h1>Context gaps and blind evals</h1>
  <p class="lead">An agent is ready when it can reproduce the golden dataset blind: given only a generic prompt, the knowledge graph's instructions and its skills. During the build phase, the FDE and a customer-appointed SME keep adding the missing context and explanation until that is true. This is a requirement for every agent linked to a dataset.</p>
  <h2>What a blind eval gives the agent, and what it withholds</h2>
  <div class="grid g2">
    <div class="card"><div class="k">Given</div><ul><li>A generic prompt from <span class="tag">bld_generic_prompts</span>, such as "Prepare the 1120-PC for this client from the files in this workstream"</li><li>The case inputs, exactly as a client would provide them</li><li>The compiled instruction skill (<span class="tag">&lt;agent&gt;-instructions</span>) and the agent's other skills</li><li>Client-scope instructions synced into the case workstream</li></ul></div>
    <div class="card"><div class="k">Withheld</div><ul><li>Expected outputs, labels and states</li><li>Case notes (<span class="tag">bld_case_notes</span>)</li><li>Gap files and their evidence</li><li>Any FDE message, hint or follow-up turn</li><li>Answers to questions the agent asks: a question in a blind run is itself a context gap</li></ul></div>
  </div>
  <h2>The gap loop</h2>
  <ol class="steps">
    <li><b>Blind run.</b> abcd eval run --blind scores every case against the golden dataset.</li>
    <li><b>Classify misses.</b> builder-gaps sorts each miss: missing context, skill bug, rounding, playbook difference, or real error. Only missing context opens a gap; the rest become build plan items.</li>
    <li><b>Open a gap.</b> One row in <span class="tag">bld_context_gaps</span> and one evidence file <span class="tag">gaps/&lt;gap_id&gt;.md</span>: the case input excerpt, the agent output against the golden output, the agent's reasoning, and the Builder's hypothesis of what is missing.</li>
    <li><b>Route it.</b> The FDE answers from what they know, or sends it to the SME (abcd gap ask). The SME sees it in their Builder SME workstream and by email.</li>
    <li><b>Answer.</b> The SME works through it with the Context agent, which asks follow-ups until the answer is a rule, not a one-off. Case-specific explanations are saved as repro notes.</li>
    <li><b>Encode.</b> builder-instructions turns the answer into a generic instruction page under <span class="tag">kg/instructions/&lt;agent&gt;/</span>, with its provenance. The FDE or SME vets it.</li>
    <li><b>Leak check.</b> abcd refuses an instruction that names a case id, quotes a value from any expected output, or only makes sense for one case.</li>
    <li><b>Compile and re-run.</b> abcd instructions compile builds the instruction skill; the affected cases and then the full set re-run blind.</li>
    <li><b>Verify.</b> The gap closes only when a blind run reproduces its case without regressing any other. Otherwise it goes back to open with the new evidence.</li>
  </ol>
  <h2>Gap states</h2>
  <div class="grid g5">
    <div class="card"><span class="pill p-dr">Open</span><p style="margin-top:8px">Found by a blind run. With the Builder.</p></div>
    <div class="card"><span class="pill p-rv">Asked</span><p style="margin-top:8px">Waiting on the SME or FDE.</p></div>
    <div class="card"><span class="pill p-dr">Answered, encoded</span><p style="margin-top:8px">Turned into an instruction; waiting for a blind re-run.</p></div>
    <div class="card"><span class="pill p-ok">Verified</span><p style="margin-top:8px">A blind run reproduced the case.</p></div>
    <div class="card"><span class="pill p-dr">Waived</span><p style="margin-top:8px">A lead accepted the miss, with a recorded reason. Counted on the scorecard.</p></div>
  </div>
  <h2>How instructions reach the agent, with no platform change</h2>
  <table class="t"><tr><th>Scope</th><th>Where it lives</th><th>How the agent gets it</th></tr>
  <tr><td>Org or agent</td><td><code>kg/instructions/&lt;agent&gt;/&lt;topic&gt;.md</code> in Builder: context</td><td>Compiled into the <code>&lt;agent&gt;-instructions</code> skill (references/ files plus an index in SKILL.md). Versioned, staged and released like any skill.</td></tr>
  <tr><td>Client</td><td>The same folder, with scope = client</td><td>abcd syncs them into <code>_builder/instructions/</code> in that client's workstream and its dataset workstreams, so the harness stages them with the client's files.</td></tr></table>
  <h2>Build phase exit criteria</h2>
  <ul><li>Every active case reproduces blind, or its gap is waived with a reason a lead approved.</li>

function pMetrics() {
  return `<h1>Metrics, checks and release criteria</h1>

  <h2>Rules the Builder enforces</h2>
  <div class="grid g2">
    <div class="card"><h3>Gated evals are blind</h3><p>Every gated eval gives the agent only a generic prompt, the compiled instructions and its skills. The blind reproduction rate is a mandatory release criterion for any agent linked to a dataset.</p></div>
    <div class="card"><h3>Accuracy is defined by checks</h3><p>An output is accurate when it passes all of the client's checks. When a check is added, past runs are re-scored so trends stay comparable.</p></div>
    <div class="card"><h3>Every metric must be able to fail</h3><p>First-pass yield is the share of clients passing all checks on the first run with no human correction. A definition that is 100% by construction is refused.</p></div>
    <div class="card"><h3>Human time comes from logs</h3><p>From platform logs of user actions, split by onshore and offshore role. Nobody sits and watches screens.</p></div>
    <div class="card"><h3>One scorecard</h3><p>The release eval report and the client scorecard come from the same definitions and the same numbers. Misses are broken down by cause automatically.</p></div>
  </div>

  <p class="sub">Definitions and UAT 1 values from the pilot scorecard Nicklas shared. "To agree" marks values the scorecard still left open.</p>
  <table class="t"><tr><th>Metric</th><th>Category</th><th>Gate</th><th>Definition</th><th class="num">Baseline</th><th class="num">UAT 1</th><th class="num">Pilot target</th></tr>
  ${GPW_METRICS.map(m => `<tr><td><b>${m.m}</b> <span style="color:var(--muted)">(${m.unit})</span></td><td>${m.cat}</td><td>${m.gate ? '<span class="pill p-dr">Gate</span>' : ''}</td><td>${esc(m.def)}</td><td class="num">${m.base}</td><td class="num">${m.uat1}</td><td class="num">${m.target}</td></tr>`).join('')}</table>
  <h2>A metric definition</h2>
  <div class="term">metric: gpw-1120pc:first_pass_yield
version: 1
category: quality
unit: "%"
formula: clients passing all blocking checks on run 1 with zero human corrections / clients completed
source: [check_results, hitl_events, user_actions]
baseline: null
gate: true
signed_off: decision gpw-d-042 (10/20 call)</div>
  <h2>Release criteria for the next release</h2>
  <div class="term">agent: gpw-1120pc-prep
dataset: gpw-1120pc@4
criteria:
  - metric: accuracy          comparator: ">="           target: 95
  - metric: first_pass_yield  comparator: ">="           target: 75
  - metric: human_time        comparator: "<="           target: 9.2
  - metric: blind_repro_rate  comparator: ">="           target: 95   (mandatory)

  <h2>Checks</h2>
  <p>A check is either <b>deterministic</b> (a rule over the output, such as "every headline value within $2 of the filed return") or <b>judged</b> (a rubric scored by a model, used only where a rule cannot express it). Every check runs twice: in evals, against expected outputs, and in production, as a maker-checker step before a person sees the output.</p>`;

function pVersions() {

    <div class="card"><span class="pill p-ok">Live</span><p style="margin-top:8px">Passed the gate. Uploaded under the live names; commit tagged &lt;agent&gt;@v&lt;n&gt;.</p></div>
    <div class="card"><span class="pill p-dr">Superseded</span><p style="margin-top:8px">A previous live version. Its git tag is the rollback target.</p></div>
    <div class="card"><span class="pill p-ex">Gate failed</span><p style="margin-top:8px">The release was refused. Nothing changed under the live names.</p></div>
  </div>

  <tr><td>Skill</td><td><code>tb-reconcile</code></td><td><code>tb-reconcile--staged</code>, with the frontmatter name rewritten, because the catalog keys skills by frontmatter name</td><td>n/a</td></tr>

  </table>
  <h2>Platform limits and how abcd works around them</h2>
  <table class="t"><tr><th>Need</th><th>Platform today</th><th>How abcd covers it</th><th>What remains</th></tr>${WORKAROUNDS.map(w => `<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td></tr>`).join('')}</table>

  <h2>What abcd release does, in order</h2>
  <ol class="steps">
    <li>Re-checks that the staged shadows still match the staged hashes, and runs abcd audit drift on the live objects.</li>
    <li>Checks every release criterion against the blind staged run on that exact version, for this agent and every agent sharing a changed skill. Refuses on any failure or any error.</li>
    <li>Asks the FDE to approve.</li>
    <li>Uploads each staged bundle under its live name (replace = true), patches the live process with the staged definition (skill names rewritten back), and verifies what landed.</li>
    <li>Writes the eval report to <code>releases/&lt;agent&gt;/&lt;version&gt;/</code> in Builder: operations and copies it to the client's status workstream.</li>
    <li>Records the release in <span class="tag">bld_releases</span> with the previous version's tag as the rollback target.</li>
    <li>Tags the repo (<code>gpw-1120pc-prep@v13</code>) and attaches the eval report to the GitHub release with gh.</li>
    <li>Regenerates the agent's explainer and training kit and commits them.</li>
  </ol>`;
}

  const labels = { prompts: 'Simple prompts', quickstart: 'Quickstart', scenarios: 'Scenarios', 'whats-new': 'What changed' };
  return `<h1>Explainers and training</h1>
  <p class="lead">Understanding is a feature of the Builder. Every agent always has an explainer of its current implementation and a training kit for its users, regenerated on every release by abcd explain and abcd train, using the FDE's coding agent.</p>
  <div class="grid g2">
    <div class="card"><div class="k">For FDEs</div><h3>explainer.html</h3><p>An interactive page like this one, for one agent: its steps, skills and versions, datasets and criteria, checks, last eval, open items, and scenarios to walk through. Generated from live state, so it never drifts from what runs.</p><div class="meta"><span class="tag">agents/&lt;agent&gt;/explainer.html</span> in Builder: context and the git repo</div></div>
    <div class="card"><div class="k">For the agent's users</div><h3>The training kit</h3><p>Quickstart, simple prompts, worked scenarios, FAQ drawn from real questions in runs and HITL, and a plain-words note on what changed. Shipped with every release.</p><div class="meta"><span class="tag">agents/&lt;agent&gt;/training/</span></div></div>
  </div>
  <h2>Example training kit: Return prep (1120-PC)</h2>
  <div class="seg">${keys.map(k => `<button class="${k === state.train ? 'on' : ''}" data-train="${k}">${labels[k]}</button>`).join('')}</div>
  ${kit[state.train]}
  <div class="note">Illustrative content for an example agent.</div>
  <h2>Rules</h2>
  <ul><li>abcd release regenerates the explainer and the kit. A release whose kit fails to generate is flagged, not blocked.</li>
  <li>Prompts in the kit are tested: each runs on a dataset case during the staged test, and only prompts that work ship.</li>
  <li>The FAQ comes from real questions users asked in runs and HITL, not invented ones.</li></ul>`;
}

function pQuestions() {
  return `<h1>Open questions</h1>
  <p class="lead">These need a decision before the requirements freeze. Each becomes a recorded decision once settled.</p>
  <table class="t"><tr><th>Question</th><th>Detail</th><th>Status</th></tr>${OPEN_Q.map(q => `<tr><td><b>${q[0]}</b></td><td>${q[1]}</td><td>${DEC}</td></tr>`).join('')}</table>`;
}

/* Events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-step],[data-scen],[data-sstep],[data-table],[data-tfilter],[data-role],[data-agent],[data-ptab],[data-crud],[data-train],[data-kind],[data-tree],#theme');
  if (!el) return;
  const d = el.dataset;
  if (el.id === 'theme') {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    if (root.dataset.theme === 'light') delete root.dataset.theme;
    nav(); return;
  }
  if (d.tree) { const k = el.nextElementSibling; if (k) { k.classList.toggle('closed'); el.querySelector('.caret').textContent = k.classList.contains('closed') ? '▸' : '▾'; } return; }
  if (d.go) { location.hash = d.go; document.getElementById('panel').scrollTop = 0; return; }
  if (d.step !== undefined) state.step = +d.step;
  if (d.scen !== undefined) { state.scen = +d.scen; state.sstep = 0; }
  if (d.sstep !== undefined) state.sstep = +d.sstep;
  if (d.table) state.table = d.table;
  if (d.tfilter) { state.tfilter = d.tfilter; const f = TABLES.filter(t => d.tfilter === 'All' || t.group === d.tfilter); if (f.length && !f.find(t => t.name === state.table)) state.table = f[0].name; }
  if (d.role !== undefined) state.role = +d.role;
  if (d.agent !== undefined) state.agent = +d.agent;
  if (d.ptab) state.ptab = d.ptab;
  if (d.crud !== undefined) state.crud = +d.crud;
  if (d.train) state.train = d.train;
  if (d.kind) state.kind = d.kind;
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
