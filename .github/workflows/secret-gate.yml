name: Secret & sensitive-content gate

# This repo is open source: no secrets, captures, env files, keys, client
# names or client URLs. gitleaks catches credentials; sensitive_check.py
# catches forbidden file types and denylisted client identifiers (stored only
# as SHA-256 digests in .github/sensitive-denylist.sha256).

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master, dev]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan the commits in this change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$SHA"
          else
            # New branch, or a force-push dropped `before`: everything not yet on
            # the default branch.
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" "$SHA" || true)
            if [ -n "$BASE" ] && [ "$BASE" != "$SHA" ]; then RANGE="$BASE..$SHA"; else RANGE="-1 $SHA"; fi
          fi
          echo "scanning: $RANGE"
          gitleaks git --redact --no-banner --log-opts="$RANGE" .

  sensitive-content:
    name: sensitive content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Forbidden files + denylisted client identifiers
        run: python .github/scripts/sensitive_check.py
