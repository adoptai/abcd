name: Secret & sensitive-content gate

# This repo is open source: no secrets, captures, env files, keys, client
# names or client URLs. gitleaks catches credentials; sensitive_check.py
# catches forbidden file types and denylisted client identifiers (stored only
# as SHA-256 digests in .github/sensitive-denylist.sha256).

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master, dev]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the commits in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 ${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          gitleaks git --redact --no-banner --log-opts="$RANGE" .

  sensitive-content:
    name: sensitive content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Forbidden files + denylisted client identifiers
        run: python .github/scripts/sensitive_check.py
