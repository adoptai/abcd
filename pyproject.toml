[tool.poetry]
name = "abcd"
version = "0.1.0"
description = "Agent-driven CLI toolkit for building, testing, and managing actions and workflows on the AdoptAI platform."
authors = ["Adopt AI <contact@adopt.ai>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = ">=2.31.0"
python-dotenv = ">=1.0.0"
pydantic = ">=2.0.0"
colorama = ">=0.4.6"
faiss-cpu = ">=1.7.4"
numpy = ">=1.24.0"
sentence-transformers = ">=2.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "SIM", "UP"]
ignore = ["E501"]



