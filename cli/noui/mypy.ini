# Type-check config for the NoUI toolkit bundle. The bundle imports itself as
# top-level `noui_core`, so it is checked separately from the rest of cli/
# (which uses `cli.*` package imports). Run from the repo root:
#   poetry run mypy --config-file cli/noui/mypy.ini cli/noui
[mypy]
python_version = 3.11
mypy_path = cli/noui
explicit_package_bases = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
